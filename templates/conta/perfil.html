<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meu perfil | Tudo bem aí?</title>

    <meta
        name="description"
        content="Gerencie suas informações no Tudo bem aí?"
    >


    <style>

        /* =====================================================
           RESET
        ====================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #174d8c;

            background:
                linear-gradient(
                    135deg,
                    #f5fbff 0%,
                    #eaf6ff 48%,
                    #f7fcff 100%
                );

        }


        /* =====================================================
           FUNDO DECORATIVO
        ====================================================== */

        body::before,
        body::after {

            content: "";

            position: fixed;

            border-radius: 50%;

            background:
                rgba(174, 215, 249, 0.28);

            z-index: -1;

            pointer-events: none;

        }


        body::before {

            width: 430px;
            height: 430px;

            top: -210px;
            left: -200px;

        }


        body::after {

            width: 320px;
            height: 320px;

            right: -145px;
            bottom: -130px;

        }


        /* =====================================================
           CONTEÚDO
        ====================================================== */

        .perfil-page {

            width: 100%;

            min-height:
                calc(100vh - 82px);

            display: flex;

            justify-content: center;

            align-items: flex-start;

            padding:
                44px 24px
                65px;

        }


        /* =====================================================
           CARTÃO PRINCIPAL
        ====================================================== */

        .perfil-card {

            width: 100%;

            max-width: 770px;

            background:
                rgba(255, 255, 255, 0.93);

            border-radius: 20px;

            padding:
                30px 44px
                40px;

            box-shadow:
                0 18px 50px
                rgba(68, 132, 177, 0.13);

            border:
                1px solid
                rgba(117, 181, 226, 0.10);

        }


        /* =====================================================
           VOLTAR
        ====================================================== */

        .voltar {

            display: inline-flex;

            align-items: center;

            gap: 9px;

            color: #1461ad;

            text-decoration: none;

            font-size: 18px;

            font-weight: 600;

            margin-bottom: 4px;

            transition:
                color 0.2s ease,
                transform 0.2s ease;

        }


        .voltar:hover {

            color: #0e4e92;

            transform:
                translateX(-2px);

        }


        .voltar svg {

            width: 23px;
            height: 23px;

            fill: none;

            stroke: currentColor;

            stroke-width: 2.3;

            stroke-linecap: round;

            stroke-linejoin: round;

        }


        /* =====================================================
           CABEÇALHO DO PERFIL
        ====================================================== */

        .perfil-header {

            text-align: center;

            margin-top: -8px;

            margin-bottom: 27px;

        }


        .perfil-icon {

            width: 94px;
            height: 94px;

            margin:
                0 auto 12px;

            border-radius: 50%;

            background:
                #e1f0ff;

            display: flex;

            align-items: center;

            justify-content: center;

        }


        .perfil-icon svg {

            width: 53px;
            height: 53px;

            fill: #1972c9;

        }


        .perfil-header h1 {

            color: #064d96;

            font-size: 39px;

            line-height: 1.1;

            font-weight: 700;

            margin-bottom: 7px;

        }


        .perfil-header p {

            color: #7196c4;

            font-size: 20px;

            line-height: 1.4;

        }


        /* =====================================================
           FORMULÁRIO
        ====================================================== */

        .perfil-form {

            display: flex;

            flex-direction: column;

            gap: 20px;

        }


        /* =====================================================
           CAMPO
        ====================================================== */

        .campo {

            position: relative;

            width: 100%;

            min-height: 82px;

            border:
                2px solid
                #c5e3fc;

            border-radius: 15px;

            background:
                rgba(255, 255, 255, 0.78);

            display: flex;

            align-items: center;

            padding:
                13px 20px;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;

        }


        .campo:focus-within {

            border-color: #75b7ed;

            box-shadow:
                0 0 0 4px
                rgba(117, 183, 237, 0.10);

        }


        .campo-icon {

            width: 40px;

            flex-shrink: 0;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-right: 16px;

        }


        .campo-icon svg {

            width: 31px;
            height: 31px;

            fill: none;

            stroke: #1767b5;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;

        }


        .campo-conteudo {

            flex: 1;

            min-width: 0;

        }


        .campo-label {

            display: block;

            color: #0b4f97;

            font-size: 15px;

            font-weight: 700;

            margin-bottom: 7px;

        }


        .campo input {

            width: 100%;

            border: none;

            outline: none;

            background: transparent;

            color: #7198ca;

            font-family: inherit;

            font-size: 16px;

            font-weight: 500;

        }


        .campo input::placeholder {

            color: #8caeda;

            opacity: 1;

        }


        .campo input:focus {

            color: #3c70a8;

        }


        /* =====================================================
           BOTÃO SALVAR
        ====================================================== */

        .salvar {

            width: 100%;

            max-width: 390px;

            height: 61px;

            margin:
                15px auto 0;

            border: none;

            border-radius: 32px;

            background:
                linear-gradient(
                    135deg,
                    #2588e8,
                    #2775d4
                );

            color: white;

            font-family: inherit;

            font-size: 18px;

            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 10px 22px
                rgba(37, 125, 218, 0.25);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

        }


        .salvar:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 13px 27px
                rgba(37, 125, 218, 0.31);

        }


        .salvar:active {

            transform:
                translateY(0);

        }


        /* =====================================================
           RESPONSIVIDADE
        ====================================================== */

        @media (max-width: 700px) {

            .perfil-page {

                min-height:
                    calc(100vh - 76px);

                padding:
                    25px 15px
                    45px;

            }


            .perfil-card {

                padding:
                    24px 20px
                    30px;

                border-radius: 18px;

            }


            .voltar {

                font-size: 16px;

            }


            .perfil-header {

                margin-top: 2px;

                margin-bottom: 23px;

            }


            .perfil-icon {

                width: 82px;
                height: 82px;

                margin-bottom: 10px;

            }


            .perfil-icon svg {

                width: 46px;
                height: 46px;

            }


            .perfil-header h1 {

                font-size: 31px;

            }


            .perfil-header p {

                font-size: 17px;

            }


            .campo {

                min-height: 76px;

                padding:
                    11px 14px;

            }


            .campo-icon {

                width: 34px;

                margin-right: 11px;

            }


            .campo-icon svg {

                width: 27px;
                height: 27px;

            }


            .campo-label {

                font-size: 14px;

                margin-bottom: 5px;

            }


            .campo input {

                font-size: 15px;

            }


            .salvar {

                max-width: none;

                height: 57px;

                font-size: 17px;

            }

        }


        @media (max-width: 400px) {

            .perfil-page {

                padding:
                    20px 11px
                    35px;

            }


            .perfil-card {

                padding:
                    22px 15px
                    28px;

            }


            .perfil-header h1 {

                font-size: 28px;

            }


            .perfil-header p {

                font-size: 16px;

            }


            .campo {

                padding-left: 11px;
                padding-right: 11px;

            }


            .campo-icon {

                margin-right: 8px;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    {% include 'componentes/navbar_dashboard.html' %}


    <!-- =====================================================
         PÁGINA DE PERFIL
    ====================================================== -->

    <main class="perfil-page">

        <section class="perfil-card">


            <!-- VOLTAR -->

            <a
                href="{{ url_for('dashboard') }}"
                class="voltar"
            >

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >
                    <path d="M19 12H5"></path>
                    <path d="M12 19l-7-7 7-7"></path>
                </svg>

                <span>Voltar</span>

            </a>


            <!-- CABEÇALHO -->

            <div class="perfil-header">

                <div class="perfil-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >
                        <path
                            d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"
                        />
                    </svg>

                </div>


                <h1>
                    Meu perfil
                </h1>


                <p>
                    Gerencie suas informações
                </p>

            </div>


            <!-- FORMULÁRIO -->

            <form
                class="perfil-form"
                id="perfilForm"
            >


                <!-- NOME -->

                <div class="campo">

                    <div class="campo-icon">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <circle
                                cx="12"
                                cy="8"
                                r="4"
                            ></circle>

                            <path
                                d="M4 21c0-4 3.6-7 8-7s8 3 8 7"
                            ></path>

                        </svg>

                    </div>


                    <div class="campo-conteudo">

                        <label
                            class="campo-label"
                            for="nome"
                        >
                            Nome
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite seu nome completo"
                            autocomplete="name"
                        >

                    </div>

                </div>


                <!-- E-MAIL -->

                <div class="campo">

                    <div class="campo-icon">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="14"
                                rx="2"
                            ></rect>

                            <path
                                d="m3 7 9 6 9-6"
                            ></path>

                        </svg>

                    </div>


                    <div class="campo-conteudo">

                        <label
                            class="campo-label"
                            for="email"
                        >
                            E-mail
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="seuemail@exemplo.com"
                            autocomplete="email"
                        >

                    </div>

                </div>


                <!-- DATA DE NASCIMENTO -->

                <div class="campo">

                    <div class="campo-icon">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >
                            <rect
                                x="3"
                                y="5"
                                width="18"
                                height="16"
                                rx="2"
                            ></rect>

                            <path
                                d="M16 3v4M8 3v4M3 10h18"
                            ></path>

                        </svg>

                    </div>


                    <div class="campo-conteudo">

                        <label
                            class="campo-label"
                            for="data_nascimento"
                        >
                            Data de nascimento
                        </label>

                        <input
                            type="text"
                            id="data_nascimento"
                            name="data_nascimento"
                            placeholder="dd/mm/aaaa"
                            inputmode="numeric"
                            autocomplete="bday"
                        >

                    </div>

                </div>


                <!-- BOTÃO -->

                <button
                    type="submit"
                    class="salvar"
                >
                    Salvar alterações
                </button>


            </form>

        </section>

    </main>


    <!-- =====================================================
         SCRIPT
    ====================================================== -->

    <script>

        const perfilForm =
            document.getElementById("perfilForm");


        perfilForm.addEventListener(
            "submit",
            function (evento) {

                evento.preventDefault();

                /*
                 * Por enquanto o formulário é apenas visual.
                 * O salvamento real será conectado quando
                 * criarmos o sistema de usuários.
                 */

                alert(
                    "As alterações serão salvas quando sua conta estiver conectada ao sistema."
                );

            }
        );

    </script>


</body>

</html>
