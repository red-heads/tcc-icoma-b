<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pensamento positivo | Tudo bem aí?</title>


    <style>

        /* =================================
           VARIÁVEIS
        ================================= */

        :root {

            --azul-escuro: #123e78;
            --azul-principal: #287ed0;
            --azul-medio: #5c9ee8;
            --azul-claro: #dceeff;
            --fundo: #eaf5ff;

            --branco: #ffffff;

            --texto: #294d76;
            --texto-claro: #527196;

            --borda:
                rgba(255, 255, 255, 0.72);

            --sombra:
                0 15px 35px
                rgba(23, 82, 145, 0.10);

            --raio: 20px;
        }


        /* =================================
           RESET
        ================================= */

        * {

            box-sizing: border-box;

            margin: 0;

            padding: 0;
        }


        html {

            scroll-behavior: smooth;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            min-height: 100vh;

            background:

                radial-gradient(
                    circle at top left,
                    rgba(83, 157, 255, 0.16),
                    transparent 32%
                ),

                linear-gradient(
                    135deg,
                    #eaf5ff 0%,
                    #dceeff 48%,
                    #f5faff 100%
                );

            color:
                var(--texto);

            overflow-x: hidden;
        }


        /* =================================
           FORMAS DECORATIVAS
        ================================= */

        .background-shape {

            position: fixed;

            border-radius: 50%;

            pointer-events: none;

            z-index: 0;
        }


        .shape-one {

            width: 420px;

            height: 420px;

            background:
                rgba(83, 157, 255, 0.13);

            top: -180px;

            left: -140px;
        }


        .shape-two {

            width: 350px;

            height: 350px;

            background:
                rgba(31, 104, 204, 0.10);

            bottom: -150px;

            right: -120px;
        }


        .shape-three {

            width: 180px;

            height: 180px;

            background:
                rgba(112, 184, 255, 0.12);

            top: 20%;

            right: 8%;
        }


        /* =================================
           PÁGINA
        ================================= */

        .pagina {

            position: relative;

            z-index: 1;

            width:
                min(100%, 1160px);

            min-height: 100vh;

            margin: 0 auto;

            padding:
                26px
                28px
                60px;

            display: flex;

            flex-direction: column;
        }


        /* =================================
           TOPO
        ================================= */

        .topo {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 28px;
        }


        .voltar {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            min-height: 46px;

            padding:
                10px 18px;

            border:
                1px solid
                rgba(40, 126, 208, 0.14);

            border-radius: 14px;

            background:
                rgba(255, 255, 255, 0.84);

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);

            color:
                var(--azul-principal);

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 7px 18px
                rgba(23, 82, 145, 0.08);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }


        .voltar:hover {

            transform:
                translateX(-3px);

            background:
                white;

            box-shadow:
                0 10px 22px
                rgba(23, 82, 145, 0.13);
        }


        .identidade {

            text-align: right;

            color:
                var(--texto-claro);

            font-size: 13px;

            line-height: 1.4;
        }


        .identidade strong {

            display: block;

            color:
                var(--azul-escuro);

            font-size: 15px;

            font-weight: 700;
        }


        /* =================================
           CARTÃO PRINCIPAL
        ================================= */

        .conteudo {

            position: relative;

            overflow: hidden;

            flex: 1;

            display: flex;

            flex-direction: column;

            background:
                rgba(255, 255, 255, 0.48);

            border:
                1px solid
                rgba(255, 255, 255, 0.82);

            border-radius: 28px;

            padding:
                clamp(22px, 4vw, 44px);

            box-shadow:
                0 20px 50px
                rgba(23, 82, 145, 0.11);

            backdrop-filter:
                blur(14px);

            -webkit-backdrop-filter:
                blur(14px);
        }


        .conteudo::before {

            content: "";

            position: absolute;

            width: 310px;

            height: 310px;

            border-radius: 50%;

            background:
                rgba(112, 184, 255, 0.12);

            top: -190px;

            right: -110px;

            pointer-events: none;
        }


        .conteudo::after {

            content: "";

            position: absolute;

            width: 180px;

            height: 180px;

            border-radius: 50%;

            background:
                rgba(220, 238, 255, 0.55);

            bottom: -110px;

            left: -80px;

            pointer-events: none;
        }


        /* =================================
           CABEÇALHO
        ================================= */

        .cabecalho {

            position: relative;

            z-index: 2;

            text-align: center;

            max-width: 760px;

            margin:
                0 auto;
        }


        .etiqueta {

            display: inline-flex;

            align-items: center;

            gap: 8px;

            margin-bottom: 14px;

            padding:
                7px 13px;

            border-radius: 999px;

            background:
                rgba(40, 126, 208, 0.09);

            color:
                var(--azul-principal);

            font-size: 13px;

            font-weight: 700;

            letter-spacing: 0.2px;
        }


        .titulo {

            color:
                var(--azul-escuro);

            font-size:
                clamp(28px, 4vw, 38px);

            font-weight: 650;

            line-height: 1.2;

            letter-spacing: -0.5px;
        }


        .subtitulo {

            margin-top: 12px;

            color:
                var(--texto-claro);

            font-size:
                clamp(15px, 2vw, 17px);

            line-height: 1.6;
        }


        /* =================================
           ÁREA DA MENSAGEM
        ================================= */

        .area-mensagem {

            position: relative;

            z-index: 2;

            flex: 1;

            min-height: 350px;

            display: flex;

            justify-content: center;

            align-items: center;

            padding:
                34px 10px;
        }


        /* =================================
           CARTÃO DA MENSAGEM
        ================================= */

        .mensagem-card {

            width: 100%;

            max-width: 720px;

            min-height: 290px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            padding:
                42px
                clamp(25px, 5vw, 55px);

            background:
                rgba(255, 255, 255, 0.94);

            border:
                1px solid
                rgba(255, 255, 255, 0.96);

            border-radius: 27px;

            box-shadow:
                0 18px 40px
                rgba(23, 82, 145, 0.11);

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }


        .mensagem-card.trocando {

            opacity: 0;

            transform:
                translateY(10px);
        }


        /* =================================
           ÍCONE
        ================================= */

        .coracao {

            width: 70px;

            height: 70px;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-bottom: 22px;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #e5f5ff,
                    #c7e6fa
                );

            color:
                var(--azul-principal);

            font-size: 37px;

            box-shadow:
                0 8px 20px
                rgba(40, 126, 208, 0.12);

            animation:
                pulsar 3s
                ease-in-out
                infinite;
        }


        @keyframes pulsar {

            0% {

                transform:
                    scale(1);
            }

            50% {

                transform:
                    scale(1.07);
            }

            100% {

                transform:
                    scale(1);
            }
        }


        /* =================================
           TEXTO
        ================================= */

        .texto-mensagem {

            max-width: 620px;

            color:
                var(--azul-escuro);

            font-size:
                clamp(21px, 4vw, 29px);

            line-height: 1.5;

            font-weight: 450;
        }


        /* =================================
           CONTADOR
        ================================= */

        .contador-mensagens {

            margin-top: 22px;

            padding:
                6px 12px;

            border-radius: 999px;

            background:
                #edf7ff;

            color:
                var(--azul-principal);

            font-size: 13px;

            font-weight: 700;
        }


        /* =================================
           CONTROLES
        ================================= */

        .controles {

            position: relative;

            z-index: 3;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 11px;

            padding-top: 4px;
        }


        /* =================================
           NAVEGAÇÃO
        ================================= */

        .navegacao-frases {

            width: 100%;

            max-width: 590px;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 11px;
        }


        .btn-anterior,
        .btn-proxima {

            min-height: 54px;

            border-radius: 14px;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }


        /* =================================
           ANTERIOR
        ================================= */

        .btn-anterior {

            background:
                rgba(255, 255, 255, 0.90);

            color:
                var(--azul-principal);

            border:
                1.5px solid
                var(--azul-principal);
        }


        .btn-anterior:hover {

            transform:
                translateY(-2px);

            background:
                #edf7ff;

            box-shadow:
                0 8px 18px
                rgba(40, 126, 208, 0.11);
        }


        /* =================================
           PRÓXIMA
        ================================= */

        .btn-proxima {

            border: none;

            background:
                linear-gradient(
                    135deg,
                    #287ed0,
                    #1556a5
                );

            color: white;

            box-shadow:
                0 8px 18px
                rgba(40, 126, 208, 0.20);
        }


        .btn-proxima:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 11px 22px
                rgba(40, 126, 208, 0.25);
        }


        /* =================================
           BOTÕES SECUNDÁRIOS
        ================================= */

        .btn-favoritar,
        .btn-favoritos,
        .btn-todas {

            width:
                min(100%, 590px);

            min-height: 50px;

            padding:
                10px 20px;

            border-radius: 14px;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }


        /* =================================
           FAVORITAR
        ================================= */

        .btn-favoritar {

            background:
                rgba(255, 255, 255, 0.90);

            color:
                var(--azul-principal);

            border:
                1.5px solid
                var(--azul-principal);
        }


        .btn-favoritar:hover {

            transform:
                translateY(-2px);

            background:
                #edf7ff;

            box-shadow:
                0 8px 18px
                rgba(40, 126, 208, 0.11);
        }


        /* =================================
           FAVORITOS
        ================================= */

        .btn-favoritos {

            border: none;

            background:
                rgba(220, 238, 255, 0.88);

            color:
                var(--azul-escuro);
        }


        .btn-favoritos:hover {

            transform:
                translateY(-2px);

            background:
                #cfe7fc;

            box-shadow:
                0 7px 17px
                rgba(40, 126, 208, 0.10);
        }


        /* =================================
           TODAS
        ================================= */

        .btn-todas {

            background:
                transparent;

            border:
                1.5px solid
                #9cb9d5;

            color:
                var(--azul-principal);
        }


        .btn-todas:hover {

            transform:
                translateY(-2px);

            background:
                rgba(255, 255, 255, 0.85);

            box-shadow:
                0 7px 17px
                rgba(23, 82, 145, 0.08);
        }


        /* =================================
           LISTAS
        ================================= */

        .lista-favoritos,
        .lista-todas {

            width: 100%;

            max-width: 590px;

            margin:
                3px auto 0;

            display: none;

            animation:
                aparecer 0.3s ease;
        }


        /* =================================
           ITEM FAVORITO
        ================================= */

        .favorito-item {

            padding:
                17px 18px;

            margin-bottom: 10px;

            background:
                rgba(255, 255, 255, 0.94);

            border:
                1px solid
                rgba(255, 255, 255, 0.95);

            border-radius: 15px;

            color:
                var(--texto);

            box-shadow:
                0 6px 15px
                rgba(23, 82, 145, 0.07);

            text-align: left;

            line-height: 1.55;
        }


        /* =================================
           ITEM TODAS AS MENSAGENS
        ================================= */

        .mensagem-item {

            display: flex;

            align-items: center;

            gap: 13px;

            padding:
                15px 17px;

            margin-bottom: 9px;

            background:
                rgba(255, 255, 255, 0.94);

            border:
                1px solid
                rgba(255, 255, 255, 0.95);

            border-radius: 15px;

            color:
                var(--texto);

            box-shadow:
                0 6px 15px
                rgba(23, 82, 145, 0.07);

            text-align: left;

            line-height: 1.5;
        }


        .numero-mensagem {

            min-width: 32px;

            height: 32px;

            display: flex;

            align-items: center;

            justify-content: center;

            border-radius: 50%;

            background:
                #dceeff;

            color:
                var(--azul-principal);

            font-size: 13px;

            font-weight: 700;
        }


        /* =================================
           REMOVER FAVORITO
        ================================= */

        .remover-favorito {

            margin-top: 9px;

            padding: 0;

            background: none;

            border: none;

            color:
                var(--azul-principal);

            cursor: pointer;

            font-size: 13px;
        }


        .remover-favorito:hover {

            text-decoration: underline;
        }


        /* =================================
           ANIMAÇÃO
        ================================= */

        @keyframes aparecer {

            from {

                opacity: 0;

                transform:
                    translateY(-8px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =================================
           TABLET
        ================================= */

        @media (max-width: 900px) {

            .pagina {

                padding:
                    22px
                    20px
                    50px;
            }

        }


        /* =================================
           CELULAR
        ================================= */

        @media (max-width: 700px) {

            .pagina {

                width: 100%;

                padding:
                    16px
                    14px
                    40px;
            }


            .topo {

                margin-bottom: 17px;
            }


            .identidade {

                display: none;
            }


            .conteudo {

                border-radius: 22px;

                padding:
                    21px
                    16px
                    32px;
            }


            .titulo {

                font-size: 28px;
            }


            .area-mensagem {

                min-height: 320px;

                padding:
                    28px
                    0;
            }


            .mensagem-card {

                min-height: 270px;

                border-radius: 22px;

                padding:
                    35px 22px;
            }


            .texto-mensagem {

                font-size: 22px;
            }


            .btn-favoritar,
            .btn-favoritos,
            .btn-todas {

                width: 100%;
            }

        }


        /* =================================
           CELULAR PEQUENO
        ================================= */

        @media (max-width: 480px) {

            .pagina {

                padding:
                    14px
                    12px
                    32px;
            }


            .voltar {

                min-height: 43px;

                padding:
                    9px 14px;

                font-size: 15px;
            }


            .conteudo {

                padding:
                    20px
                    14px
                    30px;
            }


            .etiqueta {

                font-size: 12px;
            }


            .titulo {

                font-size: 25px;
            }


            .subtitulo {

                font-size: 15px;
            }


            .area-mensagem {

                min-height: 300px;

                padding:
                    22px
                    0;
            }


            .mensagem-card {

                min-height: 250px;

                padding:
                    28px
                    17px;
            }


            .coracao {

                width: 61px;

                height: 61px;

                font-size: 32px;

                margin-bottom: 18px;
            }


            .texto-mensagem {

                font-size: 20px;

                line-height: 1.45;
            }


            .contador-mensagens {

                margin-top: 18px;
            }


            .navegacao-frases {

                gap: 8px;
            }


            .btn-anterior,
            .btn-proxima {

                min-height: 49px;

                font-size: 14px;
            }


            .btn-favoritar,
            .btn-favoritos,
            .btn-todas {

                min-height: 48px;

                font-size: 14px;
            }


            .mensagem-item {

                align-items:
                    flex-start;

                font-size: 14px;
            }

        }


        /* =================================
           CELULAR MUITO PEQUENO
        ================================= */

        @media (max-width: 360px) {

            .titulo {

                font-size: 22px;
            }


            .mensagem-card {

                min-height: 235px;

                padding:
                    24px
                    14px;
            }


            .texto-mensagem {

                font-size: 18px;
            }


            .btn-anterior,
            .btn-proxima {

                font-size: 13px;
            }

        }

    </style>

</head>


<body>


    <!-- =================================
         FORMAS DECORATIVAS
    ================================= -->

    <div class="background-shape shape-one"></div>

    <div class="background-shape shape-two"></div>

    <div class="background-shape shape-three"></div>


    <!-- =================================
         PÁGINA
    ================================= -->

    <main class="pagina">


        <!-- =================================
             TOPO
        ================================= -->

        <div class="topo">


            <button
                class="voltar"
                onclick="voltar()"
                type="button"
            >

                ←

                <span>
                    Voltar
                </span>

            </button>


            <div class="identidade">

                <strong>
                    Tudo bem aí?
                </strong>

                Espaço de apoio e reflexão

            </div>


        </div>


        <!-- =================================
             CONTEÚDO
        ================================= -->

        <div class="conteudo">


            <!-- =================================
                 CABEÇALHO
            ================================= -->

            <header class="cabecalho">


                <div class="etiqueta">

                    💭 Pensamento positivo

                </div>


                <h1 class="titulo">

                    Leia e reflita sobre a mensagem

                </h1>


                <p class="subtitulo">

                    Uma pequena mensagem para
                    acompanhar o seu momento.

                </p>


            </header>


            <!-- =================================
                 ÁREA DA MENSAGEM
            ================================= -->

            <section class="area-mensagem">


                <div
                    class="mensagem-card"
                    id="mensagemCard"
                >


                    <div class="coracao">

                        ♥️

                    </div>


                    <p
                        class="texto-mensagem"
                        id="textoMensagem"
                    ></p>


                    <div
                        class="contador-mensagens"
                        id="contadorMensagens"
                    ></div>


                </div>


            </section>


            <!-- =================================
                 CONTROLES
            ================================= -->

            <section class="controles">


                <!-- =================================
                     ANTERIOR / PRÓXIMA
                ================================= -->

                <div class="navegacao-frases">


                    <button
                        class="btn-anterior"
                        onclick="mensagemAnterior()"
                        type="button"
                    >

                        ← Anterior

                    </button>


                    <button
                        class="btn-proxima"
                        onclick="proximaMensagem()"
                        type="button"
                    >

                        Próxima →

                    </button>


                </div>


                <!-- =================================
                     FAVORITAR
                ================================= -->

                <button
                    class="btn-favoritar"
                    id="favoritarBtn"
                    type="button"
                >

                    ♡ Favoritar mensagem

                </button>


                <!-- =================================
                     FAVORITOS
                ================================= -->

                <button
                    class="btn-favoritos"
                    id="favoritosBtn"
                    type="button"
                >

                    ♥ Minhas mensagens favoritas

                </button>


                <!-- =================================
                     TODAS
                ================================= -->

                <button
                    class="btn-todas"
                    id="todasBtn"
                    type="button"
                >

                    ☰ Ver todas as mensagens

                </button>


                <!-- =================================
                     LISTA DE FAVORITOS
                ================================= -->

                <div
                    class="lista-favoritos"
                    id="listaFavoritos"
                ></div>


                <!-- =================================
                     LISTA DE TODAS
                ================================= -->

                <div
                    class="lista-todas"
                    id="listaTodas"
                ></div>


            </section>


        </div>


    </main>


    <script>


        /* =================================
           MENSAGENS
        ================================= */

        const mensagens = [

            "Você não precisa resolver tudo de uma vez.",

            "Está tudo bem fazer uma pausa quando precisar.",

            "Seu esforço também merece ser reconhecido.",

            "Um momento difícil não define quem você é.",

            "Você está aprendendo, crescendo e descobrindo seu caminho.",

            "Não existe problema em não ter todas as respostas agora.",

            "Pequenos passos também são progresso.",

            "Seja gentil consigo mesmo durante o seu processo.",

            "Você merece momentos de calma e tranquilidade.",

            "Continue. Mesmo devagar, você ainda está avançando."

        ];


        /* =================================
           VARIÁVEIS
        ================================= */

        let indiceAtual = 0;


        let favoritos =
            JSON.parse(
                localStorage.getItem(
                    "favoritosICOMA"
                )
            ) || [];


        /* =================================
           ELEMENTOS
        ================================= */

        const textoMensagem =
            document.getElementById(
                "textoMensagem"
            );


        const contadorMensagens =
            document.getElementById(
                "contadorMensagens"
            );


        const mensagemCard =
            document.getElementById(
                "mensagemCard"
            );


        const favoritarBtn =
            document.getElementById(
                "favoritarBtn"
            );


        const favoritosBtn =
            document.getElementById(
                "favoritosBtn"
            );


        const listaFavoritos =
            document.getElementById(
                "listaFavoritos"
            );


        const todasBtn =
            document.getElementById(
                "todasBtn"
            );


        const listaTodas =
            document.getElementById(
                "listaTodas"
            );


        /* =================================
           MOSTRAR MENSAGEM
        ================================= */

        function mostrarMensagem() {

            textoMensagem.textContent =
                mensagens[indiceAtual];


            contadorMensagens.textContent =
                `${indiceAtual + 1} / ${mensagens.length}`;


            atualizarBotaoFavoritar();

        }


        /* =================================
           PRÓXIMA
        ================================= */

        function proximaMensagem() {

            mensagemCard.classList.add(
                "trocando"
            );


            setTimeout(
                () => {

                    indiceAtual++;


                    if (
                        indiceAtual >=
                        mensagens.length
                    ) {

                        indiceAtual = 0;

                    }


                    mostrarMensagem();


                    mensagemCard.classList.remove(
                        "trocando"
                    );

                },
                300
            );

        }


        /* =================================
           ANTERIOR
        ================================= */

        function mensagemAnterior() {

            mensagemCard.classList.add(
                "trocando"
            );


            setTimeout(
                () => {

                    indiceAtual--;


                    if (
                        indiceAtual < 0
                    ) {

                        indiceAtual =
                            mensagens.length - 1;

                    }


                    mostrarMensagem();


                    mensagemCard.classList.remove(
                        "trocando"
                    );

                },
                300
            );

        }


        /* =================================
           BOTÃO FAVORITAR
        ================================= */

        function atualizarBotaoFavoritar() {

            const mensagemAtual =
                mensagens[indiceAtual];


            if (
                favoritos.includes(
                    mensagemAtual
                )
            ) {

                favoritarBtn.innerHTML =
                    "♥ Mensagem favoritada";

            }

            else {

                favoritarBtn.innerHTML =
                    "♡ Favoritar mensagem";

            }

        }


        /* =================================
           FAVORITAR
        ================================= */

        favoritarBtn.addEventListener(
            "click",
            function () {

                const mensagemAtual =
                    mensagens[indiceAtual];


                if (
                    favoritos.includes(
                        mensagemAtual
                    )
                ) {

                    favoritos =
                        favoritos.filter(
                            mensagem =>
                                mensagem !==
                                mensagemAtual
                        );

                }

                else {

                    favoritos.push(
                        mensagemAtual
                    );

                }


                localStorage.setItem(
                    "favoritosICOMA",
                    JSON.stringify(
                        favoritos
                    )
                );


                atualizarBotaoFavoritar();


                mostrarFavoritos();

            }
        );


        /* =================================
           MOSTRAR FAVORITOS
        ================================= */

        favoritosBtn.addEventListener(
            "click",
            function () {

                if (
                    listaFavoritos.style.display ===
                    "none" ||
                    listaFavoritos.style.display ===
                    ""
                ) {

                    listaFavoritos.style.display =
                        "block";


                    favoritosBtn.innerHTML =
                        "♥ Ocultar favoritos";


                    mostrarFavoritos();

                }

                else {

                    listaFavoritos.style.display =
                        "none";


                    favoritosBtn.innerHTML =
                        "♥ Minhas mensagens favoritas";

                }

            }
        );


        /* =================================
           LISTA DE FAVORITOS
        ================================= */

        function mostrarFavoritos() {

            listaFavoritos.innerHTML = "";


            if (
                favoritos.length === 0
            ) {

                listaFavoritos.innerHTML = `

                    <div class="favorito-item">

                        Você ainda não possui
                        mensagens favoritas. 💙

                    </div>

                `;

                return;

            }


            favoritos.forEach(
                (mensagem, indice) => {

                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "favorito-item";


                    item.innerHTML = `

                        <div>

                            ♥ ${mensagem}

                        </div>


                        <button
                            class="remover-favorito"
                            onclick="removerFavorito(${indice})"
                            type="button"
                        >

                            Remover dos favoritos

                        </button>

                    `;


                    listaFavoritos.appendChild(
                        item
                    );

                }
            );

        }


        /* =================================
           REMOVER FAVORITO
        ================================= */

        function removerFavorito(
            indice
        ) {

            favoritos.splice(
                indice,
                1
            );


            localStorage.setItem(
                "favoritosICOMA",
                JSON.stringify(
                    favoritos
                )
            );


            mostrarFavoritos();


            atualizarBotaoFavoritar();

        }


        /* =================================
           TODAS AS MENSAGENS
        ================================= */

        todasBtn.addEventListener(
            "click",
            function () {

                if (
                    listaTodas.style.display ===
                    "none" ||
                    listaTodas.style.display ===
                    ""
                ) {

                    listaTodas.style.display =
                        "block";


                    todasBtn.innerHTML =
                        "▲ Ocultar mensagens";


                    mostrarTodas();

                }

                else {

                    listaTodas.style.display =
                        "none";


                    todasBtn.innerHTML =
                        "☰ Ver todas as mensagens";

                }

            }
        );


        /* =================================
           CRIAR LISTA DE TODAS
        ================================= */

        function mostrarTodas() {

            listaTodas.innerHTML = "";


            mensagens.forEach(
                (mensagem, indice) => {

                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "mensagem-item";


                    item.innerHTML = `

                        <span class="numero-mensagem">

                            ${indice + 1}

                        </span>


                        <span>

                            ${mensagem}

                        </span>

                    `;


                    listaTodas.appendChild(
                        item
                    );

                }
            );

        }


        /* =================================
           VOLTAR
        ================================= */

        function voltar() {

            window.history.back();

        }


        /* =================================
           INICIALIZAÇÃO
        ================================= */

        mostrarMensagem();

        mostrarFavoritos();

        mostrarTodas();


        listaFavoritos.style.display =
            "none";


        listaTodas.style.display =
            "none";


    </script>


</body>

</html>
