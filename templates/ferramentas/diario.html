<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Diário emocional | Tudo bem aí?</title>

    <style>
:root {
    --azul-escuro: #123e78;
    --azul-principal: #287ed0;
    --azul-medio: #5c9ee8;
    --azul-claro: #dceeff;
    --fundo: #eaf5ff;
    --branco: #ffffff;
    --texto: #294d76;
    --texto-claro: #527196;
    --borda: #deebf8;
    --sombra: 0 15px 35px rgba(23, 82, 145, 0.10);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    min-height: 100vh;
    background:
        radial-gradient(
            circle at 10% 5%,
            rgba(255,255,255,.88),
            transparent 27%
        ),
        linear-gradient(
            135deg,
            #eaf5ff 0%,
            #dceeff 45%,
            #f5faff 100%
        );
    color: var(--texto);
    overflow-x: hidden;
}

/* FORMAS SUAVES DO FUNDO */

body::before,
body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
}

body::before {
    width: 430px;
    height: 430px;
    background: rgba(83,157,255,.11);
    top: -190px;
    left: -150px;
}

body::after {
    width: 360px;
    height: 360px;
    background: rgba(31,104,204,.09);
    right: -140px;
    bottom: -150px;
}

/* PÁGINA EM TELA INTEIRA */

.pagina {
    position: relative;
    z-index: 1;
    width: min(100%, 1160px);
    min-height: 100vh;
    margin: 0 auto;
    padding: 28px 28px 55px;
}

/* ÁREA PRINCIPAL */

.diario-card,
.historico-card {
    position: relative;
    width: 100%;
    background: rgba(255,255,255,.76);
    border: 1px solid rgba(255,255,255,.85);
    border-radius: 26px;
    box-shadow: var(--sombra);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    overflow: hidden;
}

.diario-card::before,
.historico-card::before {
    content: "";
    position: absolute;
    width: 250px;
    height: 250px;
    border-radius: 50%;
    background: rgba(112,184,255,.09);
    top: -150px;
    right: -90px;
    pointer-events: none;
}

.diario-card {
    min-height: calc(100vh - 83px);
    padding: clamp(28px, 5vw, 58px);
}

.historico-card {
    min-height: calc(100vh - 83px);
    padding: clamp(28px, 5vw, 58px);
}

#diario,
#historico {
    position: relative;
    z-index: 2;
}

/* VOLTAR */

.botao-voltar {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    min-height: 46px;
    padding: 0 18px;
    margin-bottom: 34px;
    border: 1px solid #c9def2;
    border-radius: 14px;
    background: rgba(255,255,255,.82);
    color: #216bb7;
    box-shadow: 0 8px 18px rgba(35,112,190,.08);
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    transition: .2s ease;
}

.botao-voltar:hover {
    background: #fff;
    transform: translateX(-3px);
    box-shadow: 0 12px 24px rgba(35,112,190,.13);
}

/* CABEÇALHO */

h1 {
    position: relative;
    color: var(--azul-escuro);
    font-size: clamp(38px, 5vw, 54px);
    font-weight: 750;
    line-height: 1.04;
    letter-spacing: -1.5px;
    margin-bottom: 15px;
}

.subtitulo {
    position: relative;
    max-width: 700px;
    color: var(--texto-claro);
    font-size: 17px;
    line-height: 1.65;
    margin-bottom: 38px;
}

.titulo-secao {
    color: #214b7c;
    font-size: 16px;
    font-weight: 700;
    margin: 0 0 10px;
}

/* ÁREA DE SENTIMENTOS */

.aba-sentimentos {
    width: 100%;
    max-width: 900px;
    margin-bottom: 28px;
}

.botao-aba-sentimentos {
    width: 100%;
    min-height: 58px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border: 1px solid #c9def2;
    background: rgba(255,255,255,.86);
    color: #216bb7;
    border-radius: 15px;
    padding: 13px 18px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 7px 18px rgba(23,82,145,.06);
    transition: .2s ease;
}

.botao-aba-sentimentos:hover {
    background: #fff;
    border-color: #a9c9e9;
    transform: translateY(-1px);
}

.seta-aba,
.seta-edicao {
    font-size: 16px;
    transition: transform .2s ease;
}

.seta-aba.aberta,
.seta-edicao.aberta {
    transform: rotate(180deg);
}

.sentimentos {
    display: none;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 11px;
    margin-top: 11px;
    padding: 12px;
    background: rgba(248,252,255,.95);
    border: 1px solid #deebf8;
    border-radius: 17px;
    max-height: 50vh;
    overflow-y: auto;
    box-shadow: 0 8px 22px rgba(23,82,145,.06);
}

.sentimentos.aberta {
    display: grid;
}

.sentimento {
    min-height: 72px;
    border: 1px solid #d6e4f2;
    background: #fff;
    color: #425f80;
    border-radius: 14px;
    padding: 9px 7px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: .2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
}

.sentimento:hover {
    background: #edf6ff;
    border-color: #9fc5e9;
    transform: translateY(-2px);
}

.sentimento.selecionado {
    background: #dff0ff;
    border-color: #5c9ee8;
    color: #1556a5;
    font-weight: 750;
    box-shadow: 0 7px 16px rgba(40,126,208,.10);
}

.sentimento span,
.edicao-sentimento span {
    font-size: 25px;
    line-height: 1;
}

/* TEXTO */

textarea {
    width: 100%;
    max-width: 900px;
    min-height: 205px;
    resize: vertical;
    border: 1px solid #cfe0f1;
    border-radius: 17px;
    padding: 17px 18px;
    font-family: inherit;
    font-size: 15px;
    line-height: 1.65;
    color: #344f70;
    background: rgba(255,255,255,.92);
    outline: none;
    box-shadow: 0 8px 22px rgba(23,82,145,.05);
    transition: .2s ease;
}

textarea:focus {
    border-color: #5c9ee8;
    box-shadow:
        0 0 0 4px rgba(92,158,232,.12),
        0 9px 24px rgba(23,82,145,.07);
}

textarea::placeholder {
    color: #8a9caf;
}

.contador {
    width: 100%;
    max-width: 900px;
    text-align: right;
    color: #287ed0;
    font-size: 12px;
    font-weight: 650;
    margin: 7px 0 17px;
    transition:
        color .35s ease,
        transform .35s ease;
}

.contador-normal {
    color: #287ed0;
}

.contador-atencao {
    color: #e69a2f;
    transform: translateY(-1px);
}

.contador-alerta {
    color: #d95c5c;
    transform: translateY(-1px);
}

/* BOTÕES PRINCIPAIS */

.botao-principal {
    width: 100%;
    max-width: 900px;
    min-height: 54px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg,#287ed0,#1556a5);
    color: white;
    padding: 0 18px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 750;
    cursor: pointer;
    box-shadow: 0 10px 22px rgba(35,112,190,.20);
    transition: .2s ease;
}

.botao-principal:hover {
    transform: translateY(-2px);
    box-shadow: 0 14px 28px rgba(35,112,190,.27);
}

.botao-historico {
    width: 100%;
    max-width: 900px;
    min-height: 50px;
    border: 1px solid #c9def2;
    border-radius: 14px;
    background: rgba(255,255,255,.75);
    color: #216bb7;
    padding: 0 18px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin-top: 11px;
    transition: .2s ease;
}

.botao-historico:hover {
    background: #fff;
    transform: translateY(-1px);
}

/* HISTÓRICO */

#historico {
    display: none;
}

.historico-titulo {
    position: relative;
    color: var(--azul-escuro);
    font-size: clamp(34px, 5vw, 48px);
    font-weight: 750;
    line-height: 1.08;
    letter-spacing: -1px;
    margin: 0 0 30px;
}

.entry {
    display: grid;
    grid-template-columns: 58px minmax(0, 1fr);
    gap: 15px;
    align-items: center;
    width: 100%;
    max-width: 900px;
    border: 1px solid #deebf8;
    border-radius: 17px;
    padding: 14px;
    margin-bottom: 12px;
    cursor: pointer;
    background: rgba(255,255,255,.84);
    box-shadow: 0 7px 18px rgba(23,82,145,.05);
    transition: .2s ease;
}

.entry:hover {
    background: #fff;
    border-color: #c7dced;
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(23,82,145,.09);
}

.entry-emoji {
    width: 50px;
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e1efff;
    border-radius: 15px;
    font-size: 25px;
}

.entry-conteudo {
    min-width: 0;
}

.entry-sentimento {
    font-weight: 750;
    color: #216bb7;
    font-size: 14px;
    margin-bottom: 3px;
}

.entry-data {
    color: #899bb0;
    font-size: 11px;
    margin-bottom: 4px;
}

.entry-text {
    color: #586f89;
    font-size: 13px;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    text-overflow: ellipsis;
    max-height: 40px;
    overflow-wrap: break-word;
    word-break: break-word;
}

.botao-todos {
    width: 100%;
    max-width: 900px;
    border: none;
    background: transparent;
    color: #287ed0;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    padding: 12px;
}

/* MODAIS */

.registro-fundo,
.mensagem-fundo,
.confirmacao-fundo,
.edicao-fundo {
    position: fixed;
    inset: 0;
    background: rgba(30,55,85,.48);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 18px;
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
}

.registro-fundo { z-index: 1100; }
.edicao-fundo { z-index: 1200; }
.confirmacao-fundo { z-index: 1300; }
.mensagem-fundo { z-index: 1400; }

.registro-caixa,
.edicao-caixa,
.mensagem-caixa,
.confirmacao-caixa {
    width: 100%;
    background: #fff;
    border: 1px solid #e2eef9;
    border-radius: 22px;
    box-shadow: 0 20px 55px rgba(23,65,105,.22);
}

.registro-caixa {
    max-width: 500px;
    max-height: 84vh;
    overflow-y: auto;
    padding: 28px;
}

.registro-emoji {
    text-align: center;
    font-size: 52px;
    margin-bottom: 7px;
}

.registro-sentimento {
    text-align: center;
    color: #123e78;
    font-size: 23px;
    font-weight: 750;
    margin-bottom: 5px;
}

.registro-data {
    text-align: center;
    color: #899bb0;
    font-size: 12px;
    margin-bottom: 19px;
}

.registro-texto {
    color: #344f70;
    font-size: 14px;
    line-height: 1.65;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-break: break-word;
    background: #f5faff;
    border: 1px solid #e1edf8;
    border-radius: 15px;
    padding: 16px;
}

.botoes-registro {
    display: flex;
    gap: 9px;
    margin-top: 17px;
}

.botoes-registro button,
.botoes-confirmacao button {
    flex: 1;
    border: none;
    border-radius: 12px;
    min-height: 44px;
    padding: 10px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
}

.botao-editar {
    background: #dff0ff;
    color: #216bb7;
}

.botao-excluir {
    background: #fde5e5;
    color: #a74444;
}

.botao-fechar,
.botao-nao {
    background: #edf3f9;
    color: #566f89;
}

/* MENSAGEM / CONFIRMAÇÃO */

.mensagem-caixa,
.confirmacao-caixa {
    max-width: 370px;
    padding: 27px;
    text-align: center;
}

.mensagem-caixa p,
.confirmacao-caixa p {
    color: #344f70;
    font-size: 15px;
    line-height: 1.55;
    margin-bottom: 19px;
}

.botao-mensagem {
    width: 100%;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg,#287ed0,#1556a5);
    color: #fff;
    padding: 12px;
    min-height: 45px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
}

.botoes-confirmacao {
    display: flex;
    gap: 10px;
}

.botao-sim {
    background: #e56b6b;
    color: white;
}

/* EDIÇÃO */

.edicao-caixa {
    max-width: 500px;
    max-height: 90vh;
    overflow-y: auto;
    padding: 28px;
}

.edicao-titulo {
    text-align: center;
    color: #123e78;
    font-size: 25px;
    font-weight: 750;
    margin: 0 0 20px;
}

.aba-edicao-sentimentos {
    width: 100%;
    margin-bottom: 15px;
}

.botao-aba-edicao {
    width: 100%;
    min-height: 54px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border: 1px solid #c9def2;
    background: #f5faff;
    color: #216bb7;
    border-radius: 14px;
    padding: 12px 15px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.edicao-sentimentos {
    display: none;
    grid-template-columns: repeat(4, minmax(0,1fr));
    gap: 9px;
    margin-top: 9px;
    padding: 10px;
    background: #f7fbff;
    border: 1px solid #deebf8;
    border-radius: 15px;
    max-height: 45vh;
    overflow-y: auto;
}

.edicao-sentimentos.aberta {
    display: grid;
}

.edicao-sentimento {
    min-height: 64px;
    border: 1px solid #d6e4f2;
    background: #fff;
    color: #425f80;
    border-radius: 12px;
    padding: 8px 5px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    text-align: center;
    transition: .2s ease;
}

.edicao-sentimento:hover {
    background: #edf6ff;
    border-color: #9fc5e9;
}

.edicao-sentimento.selecionado {
    background: #dff0ff;
    border-color: #5c9ee8;
    color: #1556a5;
    font-weight: 750;
}

.botao-salvar-edicao {
    width: 100%;
    border: none;
    border-radius: 13px;
    background: linear-gradient(135deg,#287ed0,#1556a5);
    color: white;
    padding: 12px;
    min-height: 48px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    margin-top: 5px;
}

.botao-cancelar-edicao {
    width: 100%;
    border: none;
    border-radius: 13px;
    background: #edf3f9;
    color: #566f89;
    padding: 11px;
    min-height: 45px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    margin-top: 8px;
}

/* TABLET */

@media (max-width: 850px) {
    .pagina {
        padding: 20px 20px 40px;
    }

    .diario-card,
    .historico-card {
        min-height: calc(100vh - 60px);
        padding: 35px;
    }

    .sentimentos,
    .edicao-sentimentos {
        grid-template-columns: repeat(3, minmax(0,1fr));
    }
}

/* CELULAR */

@media (max-width: 600px) {
    .pagina {
        padding: 10px 12px 28px;
    }

    .diario-card,
    .historico-card {
        min-height: calc(100vh - 38px);
        border-radius: 22px;
        padding: 25px 19px;
    }

    .botao-voltar {
        margin-bottom: 27px;
    }

    h1 {
        font-size: 36px;
        letter-spacing: -1px;
    }

    .subtitulo {
        font-size: 15px;
        line-height: 1.58;
        margin-bottom: 30px;
    }

    .sentimentos,
    .edicao-sentimentos {
        grid-template-columns: repeat(2, minmax(0,1fr));
        gap: 8px;
        padding: 9px;
    }

    .sentimento,
    .edicao-sentimento {
        min-height: 64px;
    }

    textarea {
        min-height: 180px;
        font-size: 14px;
    }

    .botoes-registro {
        flex-direction: column;
    }

    .registro-caixa,
    .edicao-caixa {
        padding: 22px;
        border-radius: 20px;
    }
}

@media (max-width: 380px) {
    .pagina {
        padding: 8px;
    }

    .diario-card,
    .historico-card {
        padding: 22px 16px;
    }

    h1 {
        font-size: 32px;
    }

    .sentimento,
    .edicao-sentimento {
        font-size: 12px;
    }
}
</style>

</head>

<body>


    <div class="pagina">


        <!-- =====================================
             DIÁRIO
        ====================================== -->

        <section id="diario">


            <div class="diario-card">

                <button
                    class="botao-voltar"
                    onclick="voltarPagina()"
                >
                    ← Voltar
                </button>


                <h1>
                    Diário emocional
                </h1>


                <p class="subtitulo">
                    Registre como você está se sentindo.
                </p>


                <div class="titulo-secao">
                    Como você está se sentindo?
                </div>


                <!-- ABA -->

                <div class="aba-sentimentos">


                    <button
                        class="botao-aba-sentimentos"
                        onclick="alternarSentimentos()"
                    >

                        <span id="sentimentoSelecionadoTexto">
                            Escolher sentimento
                        </span>

                        <span
                            id="setaSentimentos"
                            class="seta-aba"
                        >
                            ▼
                        </span>

                    </button>


                    <!-- 16 SENTIMENTOS -->

                    <div
                        id="listaSentimentos"
                        class="sentimentos"
                    >


                        <button
                            class="sentimento"
                            data-sentimento="Bem"
                            onclick="selecionarSentimento(this)"
                        >
                            <span>🙂</span>
                            Bem
                        </button>


                        <button
                            class="sentimento"
                            data-sentimento="Neutro"
                            onclick="selecionarSentimento(this)"
                        >
                            <span>😐</span>
                            Neutro
                        </button>


                        <button
                            class="sentimento"
                            data-sentimento="Ansioso"
                            onclick="selecionarSentimento(this)"
                        >
                            <span>😟</span>
                            Ansioso
                        </button>


                        <button
                            class="sentimento"
                            data-sentimento="Triste"
                            onclick="selecionarSentimento(this)"
                        >
                            <span>😢</span>
                            Triste
                        </button>


                        <button
                            class="sentimento"
                            data-sentimento="Muito feliz"
                            onclick="selecionarSentimento(this)"
                        >
                            <span>😄</span>
                            Muito feliz
                        </button>


                        <button
                            class="sentimento"
                            data-sentimento="Calmo"
                            onclick="selecionarSentimento(this)"
                        >
                            <span>😌</span>
                            Calmo
                        </button>


                        <button
                            class="sentimento"
                            data-sentimento="Carinhoso"
                            onclick="selecionarSentimento(this)"
                        >
                            <span>🥰</span>
                            Carinhoso
                        </button>


                        <button
                            class="sentimento"
                            data-sentimento="Cansado"
                            onclick="selecionarSentimento(this)"
                        >
                            <span>😴</span>
                            Cansado
                        </button>


                        <button
                            class="sentimento"
                            data-sentimento="Irritado"
                            onclick="selecionarSentimento(this)"
                        >
                            <span>😤</span>
                            Irritado
                        </button>


                        <button
                            class="sentimento"
                            data-sentimento="Com medo"
                            onclick="selecionarSentimento(this)"
                        >
                            <span>😨</span>
                            Com medo
                        </button>


                        <button
                            class="sentimento"
                            data-sentimento="Animado"
                            onclick="selecionarSentimento(this)"
                        >
                            <span>🤩</span>
                            Animado
                        </button>


                        <button
                            class="sentimento"
                            data-sentimento="Confuso"
                            onclick="selecionarSentimento(this)"
                        >
                            <span>🤔</span>
                            Confuso
                        </button>


                        <button
                            class="sentimento"
                            data-sentimento="Desanimado"

    <script>


        let sentimentoSelecionado = null;

        let sentimentoEdicao = null;

        let indiceEdicao = null;

        let indiceSelecionado = null;


        /* =====================================
           LISTA DOS SENTIMENTOS
        ====================================== */

        const sentimentos = {

            "Bem": {
                emoji: "🙂"
            },

            "Neutro": {
                emoji: "😐"
            },

            "Ansioso": {
                emoji: "😟"
            },

            "Triste": {
                emoji: "😢"
            },

            "Muito feliz": {
                emoji: "😄"
            },

            "Calmo": {
                emoji: "😌"
            },

            "Carinhoso": {
                emoji: "🥰"
            },

            "Cansado": {
                emoji: "😴"
            },

            "Irritado": {
                emoji: "😤"
            },

            "Com medo": {
                emoji: "😨"
            },

            "Animado": {
                emoji: "🤩"
            },

            "Confuso": {
                emoji: "🤔"
            },

            "Desanimado": {
                emoji: "😔"
            },

            "Confiante": {
                emoji: "😎"
            },

            "Comemorando": {
                emoji: "🥳"
            },

            "Preocupado": {
                emoji: "😰"
            }

        };


        /* =====================================
           ABA PRINCIPAL
        ====================================== */

        function alternarSentimentos() {

            const lista =
                document.getElementById(
                    "listaSentimentos"
                );

            const seta =
                document.getElementById(
                    "setaSentimentos"
                );

            lista.classList.toggle("aberta");

            seta.classList.toggle("aberta");

        }


        /* =====================================
           SELECIONAR SENTIMENTO
        ====================================== */

        function selecionarSentimento(botao) {

            document
                .querySelectorAll(".sentimento")
                .forEach(function(item) {

                    item.classList.remove(
                        "selecionado"
                    );

                });


            botao.classList.add(
                "selecionado"
            );


            sentimentoSelecionado =
                botao.dataset.sentimento;


            const dados =
                sentimentos[
                    sentimentoSelecionado
                ];


            document.getElementById(
                "sentimentoSelecionadoTexto"
            ).textContent =
                dados.emoji +
                " " +
                sentimentoSelecionado;


            /* fecha a aba */

            document
                .getElementById(
                    "listaSentimentos"
                )
                .classList.remove("aberta");


            document
                .getElementById(
                    "setaSentimentos"
                )
                .classList.remove("aberta");

        }


        /* =====================================
           CONTADOR
        ====================================== */

        function atualizarContador() {

            const texto =
                document.getElementById(
                    "textoDiario"
                );


            const contador =
                document.getElementById(
                    "contador"
                );


            const quantidade =
                texto.value.length;

            contador.textContent =
                quantidade +
                "/750";

            atualizarCorContador(
                contador,
                quantidade
            );

        }


        function atualizarCorContador(
            contador,
            quantidade
        ) {

            contador.classList.remove(
                "contador-normal",
                "contador-atencao",
                "contador-alerta"
            );

            if (quantidade >= 713) {

                contador.classList.add(
                    "contador-alerta"
                );

            } else if (quantidade >= 600) {

                contador.classList.add(
                    "contador-atencao"
                );

            } else {

                contador.classList.add(
                    "contador-normal"
                );

            }
        }


        /* =====================================
           ENVIAR DIÁRIO
        ====================================== */

        function enviarDiario() {

            const texto =
                document
                    .getElementById(
                        "textoDiario"
                    )
                    .value
                    .trim();


            if (!sentimentoSelecionado) {

                mostrarMensagem(
                    "Escolha um sentimento antes de enviar."
                );

                return;

            }


            if (!texto) {

                mostrarMensagem(
                    "Escreva alguma coisa antes de enviar."
                );

                return;

            }


            const registros =
                JSON.parse(
                    localStorage.getItem(
                        "diarioRegistros"
                    ) || "[]"
                );


            registros.unshift({

                sentimento:
                    sentimentoSelecionado,

                texto:
                    texto,

                data:
                    new Date()
                        .toLocaleString(
                            "pt-BR"
                        )

            });


            localStorage.setItem(
                "diarioRegistros",
                JSON.stringify(registros)
            );


            document.getElementById(
                "textoDiario"
            ).value = "";


            document.getElementById(
                "contador"
            ).textContent = "0/750";


            sentimentoSelecionado = null;


            document.getElementById(
                "sentimentoSelecionadoTexto"
            ).textContent =
                "Escolher sentimento";


            document
                .querySelectorAll(
                    ".sentimento"
                )
                .forEach(function(item) {

                    item.classList.remove(
                        "selecionado"
                    );

                });


            mostrarMensagem(
                "Seu registro foi salvo com sucesso!"
            );


            mostrarHistorico();

        }


        /* =====================================
           MENSAGEM
        ====================================== */

        function mostrarMensagem(mensagem) {

            document.getElementById(
                "mensagemTexto"
            ).textContent = mensagem;


            document.getElementById(
                "mensagemFundo"
            ).style.display = "flex";

        }


        function fecharMensagem() {

            document.getElementById(
                "mensagemFundo"
            ).style.display = "none";

        }


        /* =====================================
           HISTÓRICO
        ====================================== */

        function mostrarHistorico() {

            document.getElementById(
                "diario"
            ).style.display = "none";


            document.getElementById(
                "historico"
            ).style.display = "block";


            carregarHistorico(false);

        }


        function voltarDiario() {

            document.getElementById(
                "historico"
            ).style.display = "none";


            document.getElementById(
                "diario"
            ).style.display = "block";

        }


        function carregarHistorico(
            mostrarTodosRegistros = false
        ) {

            const lista =
                document.getElementById(
                    "listaHistorico"
                );


            const botaoTodos =
                document.getElementById(
                    "botaoTodos"
                );


            const registros =
                JSON.parse(
                    localStorage.getItem(
                        "diarioRegistros"
                    ) || "[]"
                );


            lista.innerHTML = "";


            if (
                registros.length === 0
            ) {

                lista.innerHTML = `

                    <p style="
                        text-align:center;
                        color:#7a8798;
                        font-size:14px;
                    ">

                        Você ainda não possui registros.

                    </p>

                `;


                botaoTodos.style.display =
                    "none";


                return;

            }


            const quantidade =
                mostrarTodosRegistros
                    ? registros.length
                    : Math.min(
                        3,
                        registros.length
                    );


            for (
                let i = 0;
                i < quantidade;
                i++
            ) {

                const registro =
                    registros[i];


                const dados =
                    sentimentos[
                        registro.sentimento
                    ] || {
                        emoji: "🙂"
                    };


                const entrada =
                    document.createElement(
                        "div"
                    );


                entrada.className =
                    "entry";


                entrada.onclick =
                    function() {

                        abrirRegistro(i);

                    };


                entrada.innerHTML = `

                    <div class="entry-emoji">
                        ${dados.emoji}
                    </div>

                    <div class="entry-conteudo">

                        <div class="entry-sentimento">
                            ${escapeHTML(
                                registro.sentimento
                            )}
                        </div>

                        <div class="entry-data">
                            ${escapeHTML(
                                registro.data
                            )}
                        </div>

                        <div class="entry-text">
                            ${escapeHTML(
                                registro.texto
                            )}
                        </div>

                    </div>

                `;


                lista.appendChild(
                    entrada
                );

            }


            if (
                registros.length > 3 &&
                !mostrarTodosRegistros
            ) {

                botaoTodos.style.display =
                    "block";

            } else {

                botaoTodos.style.display =
                    "none";

            }

        }


        function mostrarTodos() {

            carregarHistorico(true);

        }


        /* =====================================
           ABRIR REGISTRO
        ====================================== */

        function abrirRegistro(indice) {

            const registros =
                JSON.parse(
                    localStorage.getItem(
                        "diarioRegistros"
                    ) || "[]"
                );


            const registro =
                registros[indice];


            if (!registro) {
                return;
            }


            indiceSelecionado =
                indice;


            const dados =
                sentimentos[
                    registro.sentimento
                ] || {
                    emoji: "🙂"
                };


            document.getElementById(
                "registroEmoji"
            ).textContent =
                dados.emoji;


            document.getElementById(
                "registroSentimento"
            ).textContent =
                registro.sentimento;


            document.getElementById(
                "registroData"
            ).textContent =
                registro.data;


            document.getElementById(
                "registroTexto"
            ).textContent =
                registro.texto;


            document.getElementById(
                "registroFundo"
            ).style.display =
                "flex";

        }


        function fecharRegistro() {

            document.getElementById(
                "registroFundo"
            ).style.display =
                "none";


            indiceSelecionado =
                null;

        }


        /* =====================================
           EXCLUSÃO
        ====================================== */

        function confirmarExclusao() {

            if (
                indiceSelecionado === null
            ) {
                return;
            }


            document.getElementById(
                "confirmacaoFundo"
            ).style.display =
                "flex";

        }


        function fecharConfirmacao() {

            document.getElementById(
                "confirmacaoFundo"
            ).style.display =
                "none";

        }


        function excluirRegistro() {

            if (
                indiceSelecionado === null
            ) {
                return;
            }


            const registros =
                JSON.parse(
                    localStorage.getItem(
                        "diarioRegistros"
                    ) || "[]"
                );


            registros.splice(
                indiceSelecionado,
                1
            );


            localStorage.setItem(
                "diarioRegistros",
                JSON.stringify(registros)
            );


            fecharConfirmacao();


            document.getElementById(
                "registroFundo"
            ).style.display =
                "none";


            indiceSelecionado =
                null;


            carregarHistorico(false);


            mostrarMensagem(
                "Registro excluído."
            );

        }


        /* =====================================
           EDITAR REGISTRO
        ====================================== */

        function editarRegistroSelecionado() {

            if (
                indiceSelecionado === null
            ) {
                return;
            }


            editarRegistro(
                indiceSelecionado
            );

        }


        function editarRegistro(indice) {

            const registros =
                JSON.parse(
                    localStorage.getItem(
                        "diarioRegistros"
                    ) || "[]"
                );


            const registro =
                registros[indice];


            if (!registro) {
                return;
            }


            indiceEdicao =
                indice;


            sentimentoEdicao =
                registro.sentimento;


            document.getElementById(
                "textoEdicao"
            ).value =
                registro.texto;


            document.getElementById(
                "contadorEdicao"
            ).textContent =
                registro.texto.length +
                "/300";


            /*
               Atualiza o botão da aba
               com o sentimento atual.
            */

            const dados =
                sentimentos[
                    registro.sentimento
                ] || {
                    emoji: "🙂"
                };


            document.getElementById(
                "sentimentoEdicaoTexto"
            ).textContent =
                dados.emoji +
                " " +
                registro.sentimento;


            /*
               Marca o sentimento atual.
            */

            document
                .querySelectorAll(
                    ".edicao-sentimento"
                )
                .forEach(function(item) {

                    item.classList.remove(
                        "selecionado"
                    );


                    if (
                        item.dataset.edicao ===
                        registro.sentimento
                    ) {

                        item.classList.add(
                            "selecionado"
                        );

                    }

                });


            /*
               Fecha a lista de sentimentos
               quando abre a edição.
            */

            document.getElementById(
                "listaSentimentosEdicao"
            ).classList.remove(
                "aberta"
            );


            document.getElementById(
                "setaEdicao"
            ).classList.remove(
                "aberta"
            );


            document.getElementById(
                "registroFundo"
            ).style.display =
                "none";


            document.getElementById(
                "edicaoFundo"
            ).style.display =
                "flex";

        }


        /* =====================================
           ABA DA EDIÇÃO
        ====================================== */

        function alternarSentimentosEdicao() {

            const lista =
                document.getElementById(
                    "listaSentimentosEdicao"
                );


            const seta =
                document.getElementById(
                    "setaEdicao"
                );


            lista.classList.toggle(
                "aberta"
            );


            seta.classList.toggle(
                "aberta"
            );

        }


        /* =====================================
           SELECIONAR SENTIMENTO NA EDIÇÃO
        ====================================== */

        function selecionarSentimentoEdicao(
            botao
        ) {

            document
                .querySelectorAll(
                    ".edicao-sentimento"
                )
                .forEach(function(item) {

                    item.classList.remove(
                        "selecionado"
                    );

                });


            botao.classList.add(
                "selecionado"
            );


            sentimentoEdicao =
                botao.dataset.edicao;


            const dados =
                sentimentos[
                    sentimentoEdicao
                ];


            /*
               Mostra a escolha no botão.
            */

            document.getElementById(
                "sentimentoEdicaoTexto"
            ).textContent =
                dados.emoji +
                " " +
                sentimentoEdicao;


            /*
               Fecha a aba depois da escolha.
            */

            document.getElementById(
                "listaSentimentosEdicao"
            ).classList.remove(
                "aberta"
            );


            document.getElementById(
                "setaEdicao"
            ).classList.remove(
                "aberta"
            );

        }


        /* =====================================
           CONTADOR DA EDIÇÃO
        ====================================== */

        function atualizarContadorEdicao() {

            const texto =
                document.getElementById(
                    "textoEdicao"
                );


            const contador =
                document.getElementById(
                    "contadorEdicao"
                );

            const quantidade =
                texto.value.length;

            contador.textContent =
                quantidade +
                "/750";

            atualizarCorContador(
                contador,
                quantidade
            );

        }


        /* =====================================
           SALVAR EDIÇÃO
        ====================================== */

        function salvarEdicao() {

            if (
                indiceEdicao === null
            ) {
                return;
            }


            const texto =
                document
                    .getElementById(
                        "textoEdicao"
                    )
                    .value
                    .trim();


            if (!sentimentoEdicao) {

                mostrarMensagem(
                    "Escolha um sentimento."
                );

                return;

            }


            if (!texto) {

                mostrarMensagem(
                    "Escreva alguma coisa antes de salvar."
                );

                return;

            }


            const registros =
                JSON.parse(
                    localStorage.getItem(
                        "diarioRegistros"
                    ) || "[]"
                );


            registros[
                indiceEdicao
            ].sentimento =
                sentimentoEdicao;


            registros[
                indiceEdicao
            ].texto =
                texto;


            localStorage.setItem(
                "diarioRegistros",
                JSON.stringify(registros)
            );


            fecharEdicao();


            indiceEdicao =
                null;


            sentimentoEdicao =
                null;


            carregarHistorico(false);


            mostrarMensagem(
                "Seu registro foi atualizado."
            );

        }


        /* =====================================
           FECHAR EDIÇÃO
        ====================================== */

        function fecharEdicao() {

            document.getElementById(
                "edicaoFundo"
            ).style.display =
                "none";


            document.getElementById(
                "listaSentimentosEdicao"
            ).classList.remove(
                "aberta"
            );


            document.getElementById(
                "setaEdicao"
            ).classList.remove(
                "aberta"
            );


            indiceEdicao =
                null;


            sentimentoEdicao =
                null;

        }


        /* =====================================
           PROTEGER HTML
        ====================================== */

        function escapeHTML(texto) {

            return String(texto)

                .replace(
                    /&/g,
                    "&amp;"
                )

                .replace(
                    /</g,
                    "&lt;"
                )

                .replace(
                    />/g,
                    "&gt;"
                )

                .replace(
                    /"/g,
                    "&quot;"
                )

                .replace(
                    /'/g,
                    "&#039;"
                );

        }


        /* =====================================
           VOLTAR
        ====================================== */

        function voltarPagina() {

            window.history.back();

        }


        /* =====================================
           INICIALIZAÇÃO
        ====================================== */

        carregarHistorico(false);


    </script>
