<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Respire com calma | ICOMA</title>

    <style>

        /* ================================
           RESET
        ================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #eef5ff 0%,
                    #e4f2fc 100%
                );

            color: #263f70;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 24px;
        }

        /* ================================
           CONTAINER PRINCIPAL
        ================================= */

        .pagina {

            width: 100%;

            max-width: 760px;

            min-height: 700px;

            background: #edf3fd;

            border-radius: 28px;

            padding:
                clamp(20px, 4vw, 38px);

            box-shadow:
                0 12px 35px
                rgba(48, 91, 135, 0.15);

            display: flex;

            flex-direction: column;

            position: relative;

            overflow: hidden;
        }

        .pagina::before {

            content: "";

            position: absolute;

            width: 260px;

            height: 260px;

            border-radius: 50%;

            background: #dceeff;

            top: -130px;

            right: -100px;

            opacity: 0.7;
        }

        /* ================================
           CABEÇALHO
        ================================= */

        .voltar {

            width: fit-content;

            min-height: 46px;

            padding:
                10px 18px;

            border: none;

            border-radius: 12px;

            background: white;

            color: #087fc1;

            font-size: 16px;

            cursor: pointer;

            box-shadow:
                0 3px 10px
                rgba(45, 79, 112, 0.12);

            transition:
                0.2s ease;

            position: relative;

            z-index: 2;
        }

        .voltar:hover {

            transform: translateX(-3px);

            box-shadow:
                0 5px 14px
                rgba(45, 79, 112, 0.18);
        }

        /* ================================
           TÍTULO
        ================================= */

        .cabecalho {

            text-align: center;

            margin-top: 26px;

            position: relative;

            z-index: 1;
        }

        .titulo {

            font-size:
                clamp(25px, 5vw, 34px);

            font-weight: 600;

            color: #263f70;

            margin-bottom: 7px;
        }

        .subtitulo {

            font-size:
                clamp(14px, 2.5vw, 16px);

            color: #53688f;

            line-height: 1.5;
        }

        /* ================================
           ÁREA DA RESPIRAÇÃO
        ================================= */

        .area-respiracao {

            flex: 1;

            min-height: 360px;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 20px;
        }

        .circulo-externo {

            width:
                clamp(220px, 42vw, 310px);

            aspect-ratio: 1 / 1;

            border-radius: 50%;

            background: #d5efff;

            display: flex;

            align-items: center;

            justify-content: center;

            box-shadow:
                0 0 0 12px
                rgba(255,255,255,0.25);

            transition:
                transform 4s
                cubic-bezier(
                    0.4,
                    0,
                    0.2,
                    1
                );
        }

        .circulo-meio {

            width: 84%;

            height: 84%;

            border-radius: 50%;

            background: #a9dcfa;

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .circulo-interno {

            width: 83%;

            height: 83%;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #55b5f5,
                    #389fe5
                );

            display: flex;

            justify-content: center;

            align-items: center;

            text-align: center;

            box-shadow:
                inset 0 3px 12px
                rgba(255,255,255,0.18),

                0 8px 22px
                rgba(38, 145, 211, 0.18);

            transition:
                transform 4s
                cubic-bezier(
                    0.4,
                    0,
                    0.2,
                    1
                );
        }

        .texto-respiracao {

            color: white;

            font-size:
                clamp(24px, 5vw, 34px);

            font-weight: 400;

            letter-spacing: 0.3px;
        }

        /* ================================
           ANIMAÇÃO
        ================================= */

        .inspirando .circulo-externo,
        .inspirando .circulo-interno {

            transform: scale(1.10);
        }

        .expirando .circulo-externo,
        .expirando .circulo-interno {

            transform: scale(0.88);
        }

        /* ================================
           CARD DE CONTROLE
        ================================= */

        .card {

            background: white;

            border-radius: 18px;

            padding:
                22px;

            box-shadow:
                0 7px 20px
                rgba(47, 78, 109, 0.12);

            position: relative;

            z-index: 2;
        }

        /* ================================
           ESCOLHA DE TEMPO
        ================================= */

        .escolha-tempo {

            margin-bottom: 22px;
        }

        .titulo-tempo {

            color: #263f70;

            font-size: 16px;

            font-weight: 600;

            margin-bottom: 12px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        /* BOTÃO DISCRETO PARA ABRIR/FECHAR */

        .btn-recolher {

            border: none;

            background: transparent;

            color: #6d83a5;

            font-size: 18px;

            width: 28px;

            height: 28px;

            border-radius: 50%;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            transition:
                background 0.2s ease,
                color 0.2s ease;
        }

        .btn-recolher:hover {

            background: #eef7fd;

            color: #087fc1;
        }

        /* CONTEÚDO QUE SERÁ RECOLHIDO */

        .conteudo-tempo {

            display: block;

        }

        .conteudo-tempo.fechado {

            display: none;
        }

        .tempos-rapidos {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;
        }

        .btn-tempo {

            flex: 1;

            min-width: 55px;

            min-height: 40px;

            border:
                1px solid #cbd9e8;

            border-radius: 9px;

            background: white;

            color: #627596;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .btn-tempo:hover {

            background: #e7f5fc;

            color: #087fc1;

            border-color: #a9d8f2;
        }

        .tempo-personalizado {

            display: flex;

            flex-wrap: wrap;

            gap: 8px;

            margin-top: 12px;
        }

        .tempo-personalizado input {

            flex: 1;

            min-width: 70px;

            min-height: 40px;

            border:
                1px solid #cbd9e8;

            border-radius: 9px;

            padding:
                0 10px;

            color: #263f70;

            outline: none;
        }

        .tempo-personalizado input:focus {

            border-color: #56b5f4;
        }

        .btn-definir {

            min-height: 40px;

            padding:
                0 14px;

            border: none;

            border-radius: 9px;

            background: #087fc1;

            color: white;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;
        }

        .btn-definir:hover {

            background: #076fa9;
        }

        /* ================================
           INFORMAÇÕES
        ================================= */

        .informacoes {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            margin-bottom: 20px;
        }

        .rotulo {

            color: #52678e;

            font-size: 14px;
        }

        .tempo {

            color: #263f70;

            font-size: 20px;

            font-weight: 600;

            background: #edf6fd;

            padding:
                7px 12px;

            border-radius: 8px;

            min-width: 80px;

            text-align: center;
        }

        /* ================================
           BARRA DE PROGRESSO
        ================================= */

        .progresso {

            width: 100%;

            height: 6px;

            background: #e7f0f8;

            border-radius: 20px;

            overflow: hidden;

            margin-bottom: 20px;
        }

        .progresso-barra {

            width: 0%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    #56b5f4,
                    #319de3
                );

            border-radius: 20px;

            transition:
                width 1s linear;
        }

        /* ================================
           BOTÃO INICIAR
        ================================= */

        .iniciar {

            display: block;

            width: min(100%, 190px);

            min-height: 44px;

            margin:
                0 auto 20px;

            border: none;

            border-radius: 10px;

            background:
                linear-gradient(
                    135deg,
                    #4db2f3,
                    #319ee5
                );

            color: white;

            font-size: 16px;

            font-weight: 500;

            cursor: pointer;

            box-shadow:
                0 5px 12px
                rgba(48, 158, 224, 0.22);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .iniciar:hover {

            transform: translateY(-2px);

            box-shadow:
                0 8px 16px
                rgba(48, 158, 224, 0.28);
        }

        .iniciar:active {

            transform: translateY(0);
        }

        /* ================================
           CONTROLES
        ================================= */

        .controles {

            display: flex;

            justify-content: center;

            gap: 45px;
        }

        .controle {

            display: flex;

            align-items: center;

            gap: 8px;

            border: none;

            background: transparent;

            color: #168bd0;

            font-size: 15px;

            cursor: pointer;

            padding: 7px;

            border-radius: 8px;

            transition:
                background 0.2s ease;
        }

        .controle:hover {

            background: #eef8fe;
        }

        /* ================================
           ÍCONES
        ================================= */

        .icone-pausa {

            width: 25px;

            height: 25px;

            border-radius: 50%;

            background: #1684c4;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 11px;
        }

        .icone-reiniciar {

            font-size: 23px;

            color: #168bd0;

            line-height: 1;
        }

        /* ================================
           CELULAR
        ================================= */

        @media (max-width: 600px) {

            body {

                padding: 0;

                align-items: stretch;
            }

            .pagina {

                max-width: none;

                min-height: 100vh;

                border-radius: 0;

                box-shadow: none;

                padding:
                    18px 16px 22px;
            }

            .cabecalho {

                margin-top: 20px;
            }

            .area-respiracao {

                min-height: 350px;

                padding:
                    15px 0;
            }

            .card {

                padding:
                    19px 16px;
            }

            .controles {

                gap: 25px;
            }

            .tempo-personalizado {

                flex-direction: column;
            }

            .tempo-personalizado input,
            .btn-definir {

                width: 100%;
            }
        }

        /* ================================
           CELULAR PEQUENO
        ================================= */

        @media (max-width: 380px) {

            .area-respiracao {

                min-height: 300px;
            }

            .circulo-externo {

                width: 215px;
            }

            .titulo {

                font-size: 24px;
            }

            .controles {

                gap: 12px;

                justify-content:
                    space-between;
            }
        }

        /* ================================
           TABLET / DESKTOP GRANDE
        ================================= */

        @media (min-width: 900px) {

            .pagina {

                min-height: 760px;
            }

            .area-respiracao {

                min-height: 390px;
            }
        }

    </style>

</head>

<body>

    <main class="pagina">

        <!-- VOLTAR -->

        <button
            class="voltar"
            onclick="voltar()"
            type="button"
        >

            ← &nbsp; Exercícios de respiração

        </button>

        <!-- CABEÇALHO -->

        <header class="cabecalho">

            <h1 class="titulo">

                Respire com calma

            </h1>

            <p class="subtitulo">

                Siga o ritmo e respire profundamente.

            </p>

        </header>

        <!-- RESPIRAÇÃO -->

        <section class="area-respiracao">

            <div
                class="circulo-externo"
                id="circulo"
            >

                <div class="circulo-meio">

                    <div class="circulo-interno">

                        <span
                            class="texto-respiracao"
                            id="textoRespiracao"
                        >

                            Inspire...

                        </span>

                    </div>

                </div>

            </div>

        </section>

        <!-- CONTROLES -->

        <section class="card">

            <!-- ESCOLHA DE TEMPO -->

            <div class="escolha-tempo">

                <div class="titulo-tempo">

                    <span>
                        Escolha o tempo da respiração
                    </span>

                    <button
                        class="btn-recolher"
                        id="btnRecolher"
                        onclick="alternarTempo()"
                        type="button"
                        aria-label="Fechar escolha de tempo"
                    >

                        ˄

                    </button>

                </div>

                <div
                    class="conteudo-tempo"
                    id="conteudoTempo"
                >

                    <div class="tempos-rapidos">

                        <button
                            class="btn-tempo"
                            onclick="definirTempo(1)"
                            type="button"
                        >

                            1 min

                        </button>

                        <button
                            class="btn-tempo"
                            onclick="definirTempo(3)"
                            type="button"
                        >

                            3 min

                        </button>

                        <button
                            class="btn-tempo"
                            onclick="definirTempo(5)"
                            type="button"
                        >

                            5 min

                        </button>

                        <button
                            class="btn-tempo"
                            onclick="definirTempo(10)"
                            type="button"
                        >

                            10 min

                        </button>

                        <button
                            class="btn-tempo"
                            onclick="definirTempo(15)"
                            type="button"
                        >

                            15 min

                        </button>

                    </div>

                    <div class="tempo-personalizado">

                        <input
                            id="horas"
                            type="number"
                            min="0"
                            placeholder="Horas"
                        >

                        <input
                            id="minutos"
                            type="number"
                            min="0"
                            placeholder="Min"
                        >

                        <input
                            id="segundos"
                            type="number"
                            min="0"
                            placeholder="Seg"
                        >

                        <button
                            class="btn-definir"
                            onclick="definirTempoPersonalizado()"
                            type="button"
                        >

                            Definir tempo

                        </button>

                    </div>

                </div>

            </div>

            <!-- INFORMAÇÕES -->

            <div class="informacoes">

                <span class="rotulo">

                    Tempo restante

                </span>

                <span
                    class="tempo"
                    id="tempo"
                >

                    01:00

                </span>

            </div>

            <!-- BARRA DE PROGRESSO -->

            <div class="progresso">

                <div
                    class="progresso-barra"
                    id="progressoBarra"
                ></div>

            </div>

            <!-- BOTÃO INICIAR -->

            <button
                class="iniciar"
                id="btnIniciar"
                onclick="iniciar()"
                type="button"
            >

                Iniciar

            </button>

            <!-- PAUSAR / REINICIAR -->

            <div class="controles">

                <button
                    class="controle"
                    onclick="pausar()"
                    type="button"
                >

                    <span
                        class="icone-pausa"
                        id="iconePausa"
                    >

                        Ⅱ

                    </span>

                    <span id="textoPausa">

                        Pausar

                    </span>

                </button>

                <button
                    class="controle"
                    onclick="reiniciar()"
                    type="button"
                >

                    <span class="icone-reiniciar">

                        ⟳

                    </span>

                    <span>

                        Reiniciar

                    </span>

                </button>

            </div>

        </section>

    </main>

    <script>

        /* ================================
           VARIÁVEIS
        ================================= */

        let tempoRestante = 60;

        let tempoInicial = 60;

        let intervalo = null;

        let executando = false;

        let pausado = false;

        let cicloRespiracao = null;

        /* ================================
           ELEMENTOS
        ================================= */

        const textoRespiracao =
            document.getElementById(
                "textoRespiracao"
            );

        const circulo =
            document.getElementById(
                "circulo"
            );

        const tempo =
            document.getElementById(
                "tempo"
            );

        const btnIniciar =
            document.getElementById(
                "btnIniciar"
            );

        const textoPausa =
            document.getElementById(
                "textoPausa"
            );

        const iconePausa =
            document.getElementById(
                "iconePausa"
            );

        const progressoBarra =
            document.getElementById(
                "progressoBarra"
            );

        /* ================================
           ABRIR / FECHAR ESCOLHA DE TEMPO
        ================================= */

        function alternarTempo() {

            const conteudoTempo =
                document.getElementById(
                    "conteudoTempo"
                );

            const btnRecolher =
                document.getElementById(
                    "btnRecolher"
                );

            const estaFechado =
                conteudoTempo.classList.contains(
                    "fechado"
                );

            if (estaFechado) {

                conteudoTempo.classList.remove(
                    "fechado"
                );

                btnRecolher.textContent = "˄";

                btnRecolher.setAttribute(
                    "aria-label",
                    "Fechar escolha de tempo"
                );

            } else {

                conteudoTempo.classList.add(
                    "fechado"
                );

                btnRecolher.textContent = "˅";

                btnRecolher.setAttribute(
                    "aria-label",
                    "Abrir escolha de tempo"
                );

            }

        }

        /* ================================
           DEFINIR TEMPO
        ================================= */

        function definirTempo(minutos) {

            pararTudo();

            tempoInicial =
                minutos * 60;

            tempoRestante =
                tempoInicial;

            atualizarTempo();

            atualizarProgresso();

            textoRespiracao.textContent =
                "Inspire...";

            btnIniciar.textContent =
                "Iniciar";

            textoPausa.textContent =
                "Pausar";

            iconePausa.textContent =
                "Ⅱ";

            circulo.classList.remove(
                "inspirando"
            );

            circulo.classList.remove(
                "expirando"
            );
        }

        /* ================================
           TEMPO PERSONALIZADO
        ================================= */

        function definirTempoPersonalizado() {

            const horas =
                Number(
                    document.getElementById(
                        "horas"
                    ).value
                ) || 0;

            const minutos =
                Number(
                    document.getElementById(
                        "minutos"
                    ).value
                ) || 0;

            const segundos =
                Number(
                    document.getElementById(
                        "segundos"
                    ).value
                ) || 0;

            const total =
                horas * 3600 +
                minutos * 60 +
                segundos;

            if (total <= 0) {

                return;

            }

            pararTudo();

            tempoInicial =
                total;

            tempoRestante =
                total;

            atualizarTempo();

            atualizarProgresso();

            textoRespiracao.textContent =
                "Inspire...";

            btnIniciar.textContent =
                "Iniciar";

            textoPausa.textContent =
                "Pausar";

            iconePausa.textContent =
                "Ⅱ";

            circulo.classList.remove(
                "inspirando"
            );

            circulo.classList.remove(
                "expirando"
            );
        }

        /* ================================
           INICIAR
        ================================= */

        function iniciar() {

            if (tempoRestante <= 0) {

                tempoRestante =
                    tempoInicial;

                atualizarTempo();

                atualizarProgresso();

                textoRespiracao.textContent =
                    "Inspire...";

                circulo.classList.remove(
                    "inspirando"
                );

                circulo.classList.remove(
                    "expirando"
                );
            }

            if (
                executando &&
                !pausado
            ) {

                return;

            }

            executando = true;

            pausado = false;

            btnIniciar.textContent =
                "Em andamento";

            textoPausa.textContent =
                "Pausar";

            iconePausa.textContent =
                "Ⅱ";

            iniciarRespiracao();

            clearInterval(intervalo);

            intervalo =
                setInterval(
                    function() {

                        tempoRestante--;

                        atualizarTempo();

                        atualizarProgresso();

                        if (
                            tempoRestante <= 0
                        ) {

                            finalizar();

                        }

                    },
                    1000
                );
        }

        /* ================================
           CICLO DE RESPIRAÇÃO
        ================================= */

        function iniciarRespiracao() {

            if (
                !executando ||
                pausado
            ) {

                return;

            }

            textoRespiracao.textContent =
                "Inspire...";

            circulo.classList.remove(
                "expirando"
            );

            circulo.classList.add(
                "inspirando"
            );

            cicloRespiracao =
                setTimeout(
                    function() {

                        if (
                            !executando ||
                            pausado
                        ) {

                            return;

                        }

                        textoRespiracao.textContent =
                            "Expire...";

                        circulo.classList.remove(
                            "inspirando"
                        );

                        circulo.classList.add(
                            "expirando"
                        );

                        cicloRespiracao =
                            setTimeout(
                                function() {

                                    if (
                                        !executando ||
                                        pausado
                                    ) {

                                        return;

                                    }

                                    iniciarRespiracao();

                                },
                                4000
                            );

                    },
                    4000
                );
        }

        /* ================================
           PAUSAR
        ================================= */

        function pausar() {

            if (!executando) {

                return;

            }

            if (!pausado) {

                pausado = true;

                clearInterval(
                    intervalo
                );

                clearTimeout(
                    cicloRespiracao
                );

                textoPausa.textContent =
                    "Continuar";

                iconePausa.textContent =
                    "▶";

                textoRespiracao.textContent =
                    "Pausado";

                circulo.classList.remove(
                    "inspirando"
                );

                circulo.classList.remove(
                    "expirando"
                );

            } else {

                iniciar();

            }

        }

        /* ================================
           REINICIAR
        ================================= */

        function reiniciar() {

            clearInterval(
                intervalo
            );

            clearTimeout(
                cicloRespiracao
            );

            tempoRestante =
                tempoInicial;

            executando = false;

            pausado = false;

            atualizarTempo();

            atualizarProgresso();

            textoRespiracao.textContent =
                "Inspire...";

            textoPausa.textContent =
                "Pausar";

            iconePausa.textContent =
                "Ⅱ";

            btnIniciar.textContent =
                "Iniciar";

            circulo.classList.remove(
                "inspirando"
            );

            circulo.classList.remove(
                "expirando"
            );

        }

        /* ================================
           FINALIZAR
        ================================= */

        function finalizar() {

            clearInterval(
                intervalo
            );

            clearTimeout(
                cicloRespiracao
            );

            executando = false;

            pausado = false;

            tempoRestante = 0;

            atualizarTempo();

            progressoBarra.style.width =
                "100%";

            textoRespiracao.textContent =
                "Concluído!";

            btnIniciar.textContent =
                "Iniciar novamente";

            circulo.classList.remove(
                "inspirando"
            );

            circulo.classList.remove(
                "expirando"
            );

        }

        /* ================================
           ATUALIZAR TEMPO
        ================================= */

        function atualizarTempo() {

            if (tempoRestante <= 0) {

                tempo.textContent =
                    "00:00";

                return;

            }

            const horas =
                Math.floor(
                    tempoRestante / 3600
                );

            const minutos =
                Math.floor(
                    (tempoRestante % 3600) / 60
                );

            const segundos =
                tempoRestante % 60;

            if (horas > 0) {

                tempo.textContent =
                    String(horas).padStart(2, "0") +
                    ":" +
                    String(minutos).padStart(2, "0") +
                    ":" +
                    String(segundos).padStart(2, "0");

            } else {

                tempo.textContent =
                    String(minutos).padStart(2, "0") +
                    ":" +
                    String(segundos).padStart(2, "0");

            }

        }

        /* ================================
           ATUALIZAR PROGRESSO
        ================================= */

        function atualizarProgresso() {

            if (tempoInicial <= 0) {

                return;

            }

            const progresso =
                (
                    (tempoInicial - tempoRestante)
                    / tempoInicial
                ) * 100;

            progressoBarra.style.width =
                progresso + "%";

        }

        /* ================================
           PARAR TUDO
        ================================= */

        function pararTudo() {

            clearInterval(
                intervalo
            );

            clearTimeout(
                cicloRespiracao
            );

            intervalo = null;

            cicloRespiracao = null;

            executando = false;

            pausado = false;

        }

        /* ================================
           VOLTAR
        ================================= */

        function voltar() {

            window.history.back();

        }

        /* ================================
           INICIALIZAÇÃO
        ================================= */

        atualizarTempo();

        atualizarProgresso();

    </script>

</body>

</html>
