<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro - Plataforma de Educação [icoma.com]</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <header>
    <section name="navbar-site">
      <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <a class="navbar-brand" href="/">
            <img src="{{url_for('static', filename='logo_icone.png')}}" alt="Logo" width="40" height="40"
              class="d-inline-block align-text-top">
          </a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/">{{site}}</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/login">Login</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </section>
  </header>
  <main>
    <section name="grid-register" class="mt-5">
      <div class="container text-center">
        <div class="row">
          <div class="col-sm"></div>
          <div class="col-sm-6 col-md-5">
            <h2 class="mb-4">Criar Conta</h2>
            
            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                  </div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST" action="/register">
              <div class="mb-3 text-start">
                <label for="inputName" class="form-label">Nome Completo:</label>
                <input type="text" class="form-control" id="inputName" name="nome" required>
              </div>
              <div class="mb-3 text-start">
                <label for="inputEmail" class="form-label">E-mail:</label>
                <input type="email" class="form-control" id="inputEmail" name="email" aria-describedby="emailHelp" required>
              </div>
              <div class="mb-3 text-start">
                <label for="inputPassword" class="form-label">Senha:</label>
                <input type="password" class="form-control" id="inputPassword" name="senha" required>
              </div>
              <div class="mb-3 text-start">
                <label for="inputConfirmPassword" class="form-label">Confirmação de Senha:</label>
                <input type="password" class="form-control" id="inputConfirmPassword" name="confirma_senha" required>
              </div>
              <button type="submit" class="btn btn-success w-100 mt-3">Cadastrar</button>
              <div class="mt-3">
                <span>Já tem uma conta? <a href="/login">Faça Login</a></span>
              </div>
            </form>
          </div>
          <div class="col-sm"></div>
        </div>
      </div>
    </section>
  </main>
  <footer>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"></script>
  </footer>
</body>

</html>
