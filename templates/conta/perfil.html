<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Meu perfil | Tudo bem aí?</title>

    <meta
        name="description"
        content="Visualize as informações da sua conta no Tudo bem aí?"
    >


    <style>

        /* =====================================================
           RESET
        ====================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #174d8c;

            background:
                linear-gradient(
                    135deg,
                    #f5fbff 0%,
                    #eaf6ff 48%,
                    #f7fcff 100%
                );

        }


        /* =====================================================
           FUNDO DECORATIVO
        ====================================================== */

        body::before,
        body::after {

            content: "";

            position: fixed;

            border-radius: 50%;

            background:
                rgba(174, 215, 249, 0.28);

            z-index: -1;

            pointer-events: none;

        }


        body::before {

            width: 430px;
            height: 430px;

            top: -210px;
            left: -200px;

        }


        body::after {

            width: 320px;
            height: 320px;

            right: -145px;
            bottom: -130px;

        }


        /* =====================================================
           PÁGINA
        ====================================================== */

        .perfil-page {

            width: 100%;

            min-height:
                calc(100vh - 82px);

            display: flex;

            justify-content: center;

            align-items: flex-start;

            padding:
                44px 24px
                65px;

        }


        /* =====================================================
           CARTÃO PRINCIPAL
        ====================================================== */

        .perfil-card {

            width: 100%;

            max-width: 700px;

            background:
                rgba(255, 255, 255, 0.94);

            border-radius: 24px;

            padding:
                30px 44px
                42px;

            box-shadow:
                0 18px 50px
                rgba(68, 132, 177, 0.13);

            border:
                1px solid
                rgba(117, 181, 226, 0.10);

        }


        /* =====================================================
           VOLTAR
        ====================================================== */

        .voltar {

            display: inline-flex;

            align-items: center;

            gap: 9px;

            color: #1461ad;

            text-decoration: none;

            font-size: 18px;

            font-weight: 600;

            margin-bottom: 8px;

            transition:
                color 0.2s ease,
                transform 0.2s ease;

        }


        .voltar:hover {

            color: #0e4e92;

            transform:
                translateX(-2px);

        }


        .voltar svg {

            width: 23px;
            height: 23px;

            fill: none;

            stroke: currentColor;

            stroke-width: 2.3;

            stroke-linecap: round;

            stroke-linejoin: round;

        }


        /* =====================================================
           CABEÇALHO
        ====================================================== */

        .perfil-header {

            text-align: center;

            margin-top: 8px;

            margin-bottom: 30px;

        }


        .perfil-header h1 {

            color: #064d96;

            font-size: 39px;

            line-height: 1.1;

            font-weight: 700;

            margin-bottom: 8px;

        }


        .perfil-header p {

            color: #7196c4;

            font-size: 19px;

            line-height: 1.4;

        }


        /* =====================================================
           FOTO DO GOOGLE
        ====================================================== */

        .foto-container {

            display: flex;

            justify-content: center;

            margin-bottom: 22px;

        }


        .foto-google {

            width: 118px;
            height: 118px;

            border-radius: 50%;

            object-fit: cover;

            display: block;

            border:
                5px solid
                #ffffff;

            box-shadow:
                0 8px 25px
                rgba(46, 120, 188, 0.18);

            background:
                #e1f0ff;

        }


        /* =====================================================
           ÁREA DO E-MAIL
        ====================================================== */

        .email-box {

            width: 100%;

            min-height: 88px;

            border:
                2px solid
                #c5e3fc;

            border-radius: 16px;

            background:
                rgba(255, 255, 255, 0.78);

            display: flex;

            align-items: center;

            padding:
                15px 20px;

            margin-bottom: 28px;

        }


        .email-icon {

            width: 46px;
            height: 46px;

            flex-shrink: 0;

            border-radius: 50%;

            background:
                #e5f2ff;

            display: flex;

            align-items: center;

            justify-content: center;

            margin-right: 15px;

        }


        .email-icon svg {

            width: 25px;
            height: 25px;

            fill: none;

            stroke: #1767b5;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;

        }


        .email-conteudo {

            min-width: 0;

            flex: 1;

        }


        .email-label {

            display: block;

            color: #0b4f97;

            font-size: 14px;

            font-weight: 700;

            margin-bottom: 5px;

        }


        .email {

            color: #557eaf;

            font-size: 17px;

            font-weight: 500;

            word-break: break-word;

        }


        /* =====================================================
           AÇÕES
        ====================================================== */

        .acoes {

            display: flex;

            flex-direction: column;

            gap: 14px;

        }


        .acao {

            width: 100%;

            min-height: 59px;

            border-radius: 15px;

            padding:
                0 20px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            font-family: inherit;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;

        }


        .acao:hover {

            transform:
                translateY(-2px);

        }


        .acao svg {

            width: 21px;
            height: 21px;

            fill: none;

            stroke: currentColor;

            stroke-width: 2;

            stroke-linecap: round;

            stroke-linejoin: round;

        }


        /* =====================================================
           SAIR
        ====================================================== */

        .acao-sair {

            border:
                2px solid
                #b9dcf8;

            background:
                #f5fbff;

            color:
                #1767b5;

        }


        .acao-sair:hover {

            background:
                #eaf6ff;

            box-shadow:
                0 7px 18px
                rgba(45, 124, 190, 0.10);

        }


        /* =====================================================
           EXCLUIR CONTA
        ====================================================== */

        .acao-excluir {

            border:
                2px solid
                #f0c4c4;

            background:
                #fffafa;

            color:
                #c65353;

        }


        .acao-excluir:hover {

            background:
                #fff1f1;

            box-shadow:
                0 7px 18px
                rgba(190, 72, 72, 0.10);

        }


        /* =====================================================
           OBSERVAÇÃO
        ====================================================== */

        .aviso-exclusao {

            margin-top: 18px;

            text-align: center;

            color:
                #91a8c2;

            font-size: 13px;

            line-height: 1.5;

        }


        /* =====================================================
           NOTIFICAÇÕES PERSONALIZADAS
        ====================================================== */

        .notificacao-overlay {

            position: fixed;

            inset: 0;

            z-index: 9999;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                rgba(24, 76, 124, 0.20);

            backdrop-filter:
                blur(5px);

            -webkit-backdrop-filter:
                blur(5px);

            opacity: 0;

            visibility: hidden;

            transition:
                opacity 0.22s ease,
                visibility 0.22s ease;

        }


        .notificacao-overlay.visivel {

            opacity: 1;

            visibility: visible;

        }


        /* =====================================================
           CARTÃO DA NOTIFICAÇÃO
        ====================================================== */

        .notificacao-card {

            width: 100%;

            max-width: 455px;

            background:
                rgba(255, 255, 255, 0.98);

            border:
                1px solid
                rgba(117, 181, 226, 0.16);

            border-radius: 22px;

            padding:
                30px;

            box-shadow:
                0 22px 60px
                rgba(42, 104, 153, 0.22);

            transform:
                translateY(15px)
                scale(0.97);

            transition:
                transform 0.22s ease;

        }


        .notificacao-overlay.visivel
        .notificacao-card {

            transform:
                translateY(0)
                scale(1);

        }


        /* =====================================================
           ÍCONE DA NOTIFICAÇÃO
        ====================================================== */

        .notificacao-icone {

            width: 58px;

            height: 58px;

            margin:
                0 auto 18px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                #e5f3ff;

            color:
                #1767b5;

        }


        .notificacao-icone.perigo {

            background:
                #fff0f0;

            color:
                #c65353;

        }


        .notificacao-icone svg {

            width: 29px;

            height: 29px;

            fill: none;

            stroke: currentColor;

            stroke-width: 1.8;

            stroke-linecap: round;

            stroke-linejoin: round;

        }


        /* =====================================================
           TEXTO DA NOTIFICAÇÃO
        ====================================================== */

        .notificacao-conteudo {

            text-align: center;

        }


        .notificacao-conteudo h2 {

            color:
                #064d96;

            font-size: 23px;

            line-height: 1.2;

            margin-bottom: 9px;

            font-weight: 700;

        }


        .notificacao-conteudo p {

            color:
                #7196c4;

            font-size: 16px;

            line-height: 1.5;

        }


        /* =====================================================
           BOTÕES DA NOTIFICAÇÃO
        ====================================================== */

        .notificacao-acoes {

            display: flex;

            gap: 11px;

            margin-top: 25px;

        }


        .notificacao-btn {

            flex: 1;

            min-height: 50px;

            border-radius: 13px;

            font-family: inherit;

            font-size: 15px;

            font-weight: 700;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;

        }


        .notificacao-btn:hover {

            transform:
                translateY(-1px);

        }


        /* =====================================================
           CANCELAR
        ====================================================== */

        .notificacao-btn.cancelar {

            border:
                2px solid
                #c5e3fc;

            background:
                #f5fbff;

            color:
                #1767b5;

        }


        .notificacao-btn.cancelar:hover {

            background:
                #eaf6ff;

        }


        /* =====================================================
           CONFIRMAR
        ====================================================== */

        .notificacao-btn.confirmar {

            border:
                2px solid
                transparent;

            background:
                linear-gradient(
                    135deg,
                    #2588e8,
                    #2775d4
                );

            color:
                #ffffff;

            box-shadow:
                0 7px 17px
                rgba(37, 125, 218, 0.20);

        }


        .notificacao-btn.confirmar:hover {

            box-shadow:
                0 9px 20px
                rgba(37, 125, 218, 0.28);

        }


        /* =====================================================
           RESPONSIVIDADE
        ====================================================== */

        @media (max-width: 700px) {

            .perfil-page {

                min-height:
                    calc(100vh - 76px);

                padding:
                    25px 15px
                    45px;

            }


            .perfil-card {

                padding:
                    24px 20px
                    30px;

                border-radius: 20px;

            }


            .voltar {

                font-size: 16px;

            }


            .perfil-header {

                margin-top: 7px;

                margin-bottom: 25px;

            }


            .perfil-header h1 {

                font-size: 31px;

            }


            .perfil-header p {

                font-size: 17px;

            }


            .foto-google {

                width: 100px;
                height: 100px;

            }


            .email-box {

                min-height: 80px;

                padding:
                    13px 15px;

            }


            .email-icon {

                width: 42px;
                height: 42px;

                margin-right: 12px;

            }


            .email {

                font-size: 15px;

            }


            .acao {

                min-height: 56px;

                font-size: 16px;

            }


            .notificacao-overlay {

                padding:
                    15px;

            }


            .notificacao-card {

                padding:
                    25px 20px;

                border-radius:
                    20px;

            }


            .notificacao-icone {

                width: 52px;

                height: 52px;

                margin-bottom:
                    15px;

            }


            .notificacao-icone svg {

                width: 26px;

                height: 26px;

            }


            .notificacao-conteudo h2 {

                font-size:
                    21px;

            }


            .notificacao-conteudo p {

                font-size:
                    15px;

            }


            .notificacao-acoes {

                margin-top:
                    21px;

            }


            .notificacao-btn {

                min-height:
                    48px;

                font-size:
                    14px;

            }

        }


        @media (max-width: 400px) {

            .perfil-page {

                padding:
                    20px 11px
                    35px;

            }


            .perfil-card {

                padding:
                    22px 15px
                    28px;

            }


            .perfil-header h1 {

                font-size: 28px;

            }


            .perfil-header p {

                font-size: 16px;

            }


            .foto-google {

                width: 92px;
                height: 92px;

            }


            .email-box {

                padding-left: 11px;
                padding-right: 11px;

            }


            .email-icon {

                margin-right: 9px;

            }


            .notificacao-acoes {

                flex-direction:
                    column-reverse;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         NAVBAR
    ====================================================== -->

    {% include 'componentes/navbar_dashboard.html' %}


    <!-- =====================================================
         PÁGINA DE PERFIL
    ====================================================== -->

    <main class="perfil-page">

        <section class="perfil-card">


            <!-- VOLTAR -->

            <a
                href="{{ url_for('dashboard') }}"
                class="voltar"
            >

                <svg
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                >

                    <path d="M19 12H5"></path>

                    <path d="M12 19l-7-7 7-7"></path>

                </svg>

                <span>
                    Voltar
                </span>

            </a>


            <!-- =================================================
                 CABEÇALHO
            ================================================== -->

            <div class="perfil-header">

                <h1>
                    Meu perfil
                </h1>

                <p>
                    Informações da sua conta
                </p>

            </div>


            <!-- =================================================
                 FOTO DO GOOGLE
            ================================================== -->

            <div class="foto-container">

                <img
                    class="foto-google"
                    src="https://www.gstatic.com/images/branding/product/1x/avatar_circle_blue_512dp.png"
                    alt="Foto do perfil"
                >

            </div>


            <!-- =================================================
                 E-MAIL
            ================================================== -->

            <div class="email-box">

                <div class="email-icon">

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <rect
                            x="3"
                            y="5"
                            width="18"
                            height="14"
                            rx="2"
                        ></rect>

                        <path
                            d="m3 7 9 6 9-6"
                        ></path>

                    </svg>

                </div>


                <div class="email-conteudo">

                    <span class="email-label">
                        Gmail
                    </span>

                    <span class="email">
                        seuemail@gmail.com
                    </span>

                </div>

            </div>


            <!-- =================================================
                 AÇÕES
            ================================================== -->

            <div class="acoes">


                <!-- SAIR -->

                <button
                    type="button"
                    class="acao acao-sair"
                    id="btnSair"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M10 17l5-5-5-5"
                        ></path>

                        <path
                            d="M15 12H3"
                        ></path>

                        <path
                            d="M21 19V5a2 2 0 0 0-2-2h-5"
                        ></path>

                    </svg>

                    <span>
                        Sair
                    </span>

                </button>


                <!-- EXCLUIR CONTA -->

                <button
                    type="button"
                    class="acao acao-excluir"
                    id="btnExcluir"
                >

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M4 7h16"
                        ></path>

                        <path
                            d="M10 11v6"
                        ></path>

                        <path
                            d="M14 11v6"
                        ></path>

                        <path
                            d="M6 7l1 14h10l1-14"
                        ></path>

                        <path
                            d="M9 7V4h6v3"
                        ></path>

                    </svg>

                    <span>
                        Excluir conta
                    </span>

                </button>


            </div>


            <p class="aviso-exclusao">

                A exclusão da conta é permanente
                e não poderá ser desfeita.

            </p>


        </section>

    </main>


    <!-- =====================================================
         SCRIPT
    ====================================================== -->

    <script>


        /* =====================================================
           NOTIFICAÇÃO PERSONALIZADA
        ====================================================== */

        function mostrarNotificacao(
            titulo,
            mensagem,
            tipo = "normal",
            mostrarCancelar = false,
            callbackConfirmar = null
        ) {

            const antiga =
                document.querySelector(
                    ".notificacao-overlay"
                );


            if (antiga) {
                antiga.remove();
            }


            /* Ícone */

            let icone = "";


            if (tipo === "perigo") {

                icone = `

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <path
                            d="M12 3 2.8 20h18.4L12 3Z"
                        ></path>

                        <path
                            d="M12 9v5"
                        ></path>

                        <circle
                            cx="12"
                            cy="17.5"
                            r="0.7"
                        ></circle>

                    </svg>

                `;

            } else {

                icone = `

                    <svg
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                    >

                        <circle
                            cx="12"
                            cy="12"
                            r="9"
                        ></circle>

                        <path
                            d="M12 10v6"
                        ></path>

                        <circle
                            cx="12"
                            cy="7"
                            r="0.7"
                        ></circle>

                    </svg>

                `;

            }


            /* Criar notificação */

            const overlay =
                document.createElement("div");


            overlay.className =
                "notificacao-overlay";


            overlay.innerHTML = `

                <div class="notificacao-card">

                    <div class="notificacao-icone ${tipo}">
                        ${icone}
                    </div>


                    <div class="notificacao-conteudo">

                        <h2>
                            ${titulo}
                        </h2>

                        <p>
                            ${mensagem}
                        </p>

                    </div>


                    <div class="notificacao-acoes">

                        ${
                            mostrarCancelar
                            ?
                            `
                                <button
                                    type="button"
                                    class="notificacao-btn cancelar"
                                    id="notificacaoCancelar"
                                >
                                    Cancelar
                                </button>
                            `
                            :
                            ""
                        }


                        <button
                            type="button"
                            class="notificacao-btn confirmar"
                            id="notificacaoConfirmar"
                        >
                            ${
                                mostrarCancelar
                                ?
                                "Continuar"
                                :
                                "Entendi"
                            }
                        </button>

                    </div>

                </div>

            `;


            document.body.appendChild(
                overlay
            );


            /* Ativar animação */

            requestAnimationFrame(
                function () {

                    overlay.classList.add(
                        "visivel"
                    );

                }
            );


            /* Cancelar */

            const cancelar =
                document.getElementById(
                    "notificacaoCancelar"
                );


            if (cancelar) {

                cancelar.addEventListener(
                    "click",
                    function () {

                        fecharNotificacao();

                    }
                );

            }


            /* Confirmar */

            const confirmar =
                document.getElementById(
                    "notificacaoConfirmar"
                );


            confirmar.addEventListener(
                "click",
                function () {

                    if (callbackConfirmar) {

                        callbackConfirmar();

                    }

                    fecharNotificacao();

                }
            );


            /* Clicar fora */

            overlay.addEventListener(
                "click",
                function (evento) {

                    if (
                        evento.target === overlay
                    ) {

                        fecharNotificacao();

                    }

                }
            );

        }


        /* =====================================================
           FECHAR NOTIFICAÇÃO
        ====================================================== */

        function fecharNotificacao() {

            const overlay =
                document.querySelector(
                    ".notificacao-overlay"
                );


            if (!overlay) {
                return;
            }


            overlay.classList.remove(
                "visivel"
            );


            setTimeout(
                function () {

                    if (overlay) {
                        overlay.remove();
                    }

                },
                220
            );

        }


        /* =====================================================
           SAIR
        ====================================================== */

        const btnSair =
            document.getElementById(
                "btnSair"
            );


        btnSair.addEventListener(
            "click",
            function () {

                mostrarNotificacao(

                    "Sair da conta?",

                    "Você será desconectado do Tudo bem aí?.",

                    "normal",

                    true,

                    function () {

                        /*
                         * Futuramente conectar aqui
                         * ao sistema de autenticação.
                         */

                        mostrarNotificacao(

                            "Tudo certo!",

                            "A função de sair será conectada ao sistema de autenticação.",

                            "normal"

                        );

                    }

                );

            }
        );


        /* =====================================================
           EXCLUIR CONTA
        ====================================================== */

        const btnExcluir =
            document.getElementById(
                "btnExcluir"
            );


        btnExcluir.addEventListener(
            "click",
            function () {

                mostrarNotificacao(

                    "Excluir sua conta?",

                    "Essa ação será permanente e não poderá ser desfeita.",

                    "perigo",

                    true,

                    function () {

                        /*
                         * Futuramente conectar aqui
                         * à exclusão real da conta.
                         */

                        mostrarNotificacao(

                            "Exclusão de conta",

                            "A exclusão da conta será conectada ao sistema de usuários.",

                            "perigo"

                        );

                    }

                );

            }
        );


    </script>


</body>

</html>
