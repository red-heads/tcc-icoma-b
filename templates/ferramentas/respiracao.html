<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Respire com calma | ICOMA</title>

    <style>

        /* ==================================================
           RESET
        ================================================== */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* ==================================================
           VARIÁVEIS VISUAIS
        ================================================== */

        :root {

            --azul-escuro: #123e78;

            --azul-principal: #287ed0;

            --azul-medio: #5c9ee8;

            --azul-claro: #dceeff;

            --fundo: #eaf5ff;

            --branco: #ffffff;

            --texto: #294d76;

            --texto-claro: #527196;

            --borda: rgba(40, 126, 208, 0.12);

            --sombra:
                0 15px 35px
                rgba(23, 82, 145, 0.10);

            --raio: 18px;
        }

        /* ==================================================
           BODY
        ================================================== */

        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            min-height: 100vh;

            background:

                radial-gradient(
                    circle at top left,
                    rgba(92, 158, 232, 0.15),
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #eaf5ff 0%,
                    #dceeff 50%,
                    #f5faff 100%
                );

            color: var(--texto);

            padding: 24px;

            overflow-x: hidden;

            display: flex;

            align-items: center;

            justify-content: center;

            position: relative;
        }

        /* ==================================================
           FORMAS DECORATIVAS
        ================================================== */

        body::before {

            content: "";

            position: fixed;

            width: 420px;

            height: 420px;

            border-radius: 50%;

            background:
                rgba(83, 157, 255, 0.12);

            top: -180px;

            left: -140px;

            pointer-events: none;
        }

        body::after {

            content: "";

            position: fixed;

            width: 350px;

            height: 350px;

            border-radius: 50%;

            background:
                rgba(31, 104, 204, 0.09);

            right: -120px;

            bottom: -150px;

            pointer-events: none;
        }

        /* ==================================================
           PÁGINA PRINCIPAL
        ================================================== */

        .pagina {

            width: min(100%, 1160px);

            min-height: calc(100vh - 48px);

            background:
                rgba(255, 255, 255, 0.42);

            border:
                1px solid
                rgba(255, 255, 255, 0.75);

            border-radius: 28px;

            padding:
                26px
                clamp(22px, 4vw, 44px)
                42px;

            box-shadow:
                0 20px 55px
                rgba(23, 82, 145, 0.12);

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

            display: flex;

            flex-direction: column;

            position: relative;

            overflow: hidden;
        }

        .pagina::before {

            content: "";

            position: absolute;

            width: 300px;

            height: 300px;

            border-radius: 50%;

            background:
                rgba(112, 184, 255, 0.10);

            top: -150px;

            right: -80px;

            pointer-events: none;
        }

        /* ==================================================
           BOTÃO VOLTAR
        ================================================== */

        .voltar {

            width: fit-content;

            min-height: 46px;

            padding:
                10px 18px;

            border:
                1px solid
                rgba(40, 126, 208, 0.10);

            border-radius: 14px;

            background:
                rgba(255, 255, 255, 0.92);

            color:
                var(--azul-principal);

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 5px 16px
                rgba(23, 82, 145, 0.08);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;

            position: relative;

            z-index: 5;
        }

        .voltar:hover {

            transform:
                translateX(-3px);

            background: white;

            box-shadow:
                0 8px 20px
                rgba(23, 82, 145, 0.13);
        }

        .voltar:active {

            transform:
                translateX(0);
        }

        /* ==================================================
           CABEÇALHO
        ================================================== */

        .cabecalho {

            text-align: center;

            margin:
                28px auto 0;

            max-width: 700px;

            position: relative;

            z-index: 2;
        }

        .titulo {

            color:
                var(--azul-escuro);

            font-size:
                clamp(29px, 5vw, 40px);

            line-height: 1.15;

            font-weight: 650;

            letter-spacing:
                -0.5px;

            margin-bottom: 9px;
        }

        .subtitulo {

            color:
                var(--texto-claro);

            font-size:
                clamp(15px, 2.5vw, 17px);

            line-height: 1.6;
        }

        /* ==================================================
           ÁREA DA RESPIRAÇÃO
        ================================================== */

        .area-respiracao {

            flex: 1;

            min-height: 400px;

            display: flex;

            align-items: center;

            justify-content: center;

            padding:
                30px 20px;

            position: relative;

            z-index: 1;
        }

        /* ==================================================
           CÍRCULO EXTERNO
        ================================================== */

        .circulo-externo {

            width:
                clamp(235px, 35vw, 330px);

            aspect-ratio: 1 / 1;

            border-radius: 50%;

            background:
                rgba(220, 238, 255, 0.95);

            display: flex;

            align-items: center;

            justify-content: center;

            box-shadow:

                0 0 0 12px
                rgba(255, 255, 255, 0.35),

                0 18px 40px
                rgba(40, 126, 208, 0.10);

            transition:
                transform 4s
                cubic-bezier(
                    0.4,
                    0,
                    0.2,
                    1
                );
        }

        /* ==================================================
           CÍRCULO DO MEIO
        ================================================== */

        .circulo-meio {

            width: 84%;

            height: 84%;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #bce5fb,
                    #9fd8f5
                );

            display: flex;

            align-items: center;

            justify-content: center;

            box-shadow:
                inset 0 3px 12px
                rgba(255, 255, 255, 0.28);
        }

        /* ==================================================
           CÍRCULO INTERNO
        ================================================== */

        .circulo-interno {

            width: 83%;

            height: 83%;

            border-radius: 50%;

            background:
                linear-gradient(
                    145deg,
                    #55b5f5,
                    #287ed0
                );

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 20px;

            box-shadow:

                inset 0 4px 15px
                rgba(255, 255, 255, 0.20),

                0 12px 28px
                rgba(40, 126, 208, 0.22);

            transition:
                transform 4s
                cubic-bezier(
                    0.4,
                    0,
                    0.2,
                    1
                );
        }

        .texto-respiracao {

            color: white;

            font-size:
                clamp(24px, 4vw, 35px);

            font-weight: 400;

            letter-spacing:
                0.2px;

            line-height: 1.2;
        }

        /* ==================================================
           ANIMAÇÃO DA RESPIRAÇÃO
        ================================================== */

        .inspirando .circulo-externo,
        .inspirando .circulo-interno {

            transform:
                scale(1.10);
        }

        .expirando .circulo-externo,
        .expirando .circulo-interno {

            transform:
                scale(0.88);
        }

        /* ==================================================
           CARD DE CONTROLES
        ================================================== */

        .card {

            width: 100%;

            max-width: 850px;

            margin:
                0 auto;

            background:
                rgba(255, 255, 255, 0.94);

            border:
                1px solid
                rgba(40, 126, 208, 0.08);

            border-radius: 22px;

            padding:
                clamp(20px, 3vw, 28px);

            box-shadow:
                0 12px 30px
                rgba(23, 82, 145, 0.10);

            position: relative;

            z-index: 3;
        }

        /* ==================================================
           ESCOLHA DE TEMPO
        ================================================== */

        .escolha-tempo {

            margin-bottom: 25px;
        }

        .titulo-tempo {

            color:
                var(--azul-escuro);

            font-size: 16px;

            font-weight: 650;

            margin-bottom: 13px;

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 10px;
        }

        /* ==================================================
           BOTÃO RECOLHER
        ================================================== */

        .btn-recolher {

            border: none;

            background:
                transparent;

            color:
                #7187a8;

            font-size: 18px;

            width: 30px;

            height: 30px;

            border-radius: 50%;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }

        .btn-recolher:hover {

            background:
                #edf7ff;

            color:
                var(--azul-principal);
        }

        /* ==================================================
           CONTEÚDO DO TEMPO
        ================================================== */

        .conteudo-tempo {

            display: block;

            animation:
                aparecer 0.2s ease;
        }

        .conteudo-tempo.fechado {

            display: none;
        }

        @keyframes aparecer {

            from {

                opacity: 0;

                transform:
                    translateY(-4px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }

        /* ==================================================
           TEMPOS RÁPIDOS
        ================================================== */

        .tempos-rapidos {

            display: flex;

            flex-wrap: wrap;

            gap: 9px;
        }

        .btn-tempo {

            flex:
                1 1 90px;

            min-width: 65px;

            min-height: 42px;

            border:
                1px solid
                #cfe0ef;

            border-radius: 11px;

            background:
                #fafdff;

            color:
                #627596;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }

        .btn-tempo:hover {

            background:
                #edf7ff;

            color:
                var(--azul-principal);

            border-color:
                #a9d8f2;

            transform:
                translateY(-1px);
        }

        .btn-tempo:active {

            transform:
                translateY(0);
        }

        /* ==================================================
           TEMPO PERSONALIZADO
        ================================================== */

        .tempo-personalizado {

            display: flex;

            flex-wrap: wrap;

            gap: 9px;

            margin-top: 12px;
        }

        .tempo-personalizado input {

            flex:
                1 1 100px;

            min-width: 80px;

            min-height: 42px;

            border:
                1px solid
                #cfe0ef;

            border-radius: 11px;

            padding:
                0 12px;

            background:
                #fafdff;

            color:
                var(--azul-escuro);

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }

        .tempo-personalizado input::placeholder {

            color:
                #8295af;
        }

        .tempo-personalizado input:focus {

            border-color:
                #56b5f4;

            box-shadow:
                0 0 0 3px
                rgba(86, 181, 244, 0.12);
        }

        .btn-definir {

            min-height: 42px;

            padding:
                0 17px;

            border: none;

            border-radius: 11px;

            background:
                linear-gradient(
                    135deg,
                    #287ed0,
                    #1556a5
                );

            color: white;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 5px 12px
                rgba(40, 126, 208, 0.18);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .btn-definir:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 7px 16px
                rgba(40, 126, 208, 0.23);
        }

        /* ==================================================
           INFORMAÇÕES
        ================================================== */

        .informacoes {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 17px;
        }

        .rotulo {

            color:
                var(--texto-claro);

            font-size: 14px;

            font-weight: 500;
        }

        .tempo {

            color:
                var(--azul-escuro);

            font-size: 20px;

            font-weight: 650;

            background:
                #edf6fd;

            padding:
                8px 14px;

            border-radius: 10px;

            min-width: 82px;

            text-align: center;

            border:
                1px solid
                rgba(40, 126, 208, 0.07);
        }

        /* ==================================================
           BARRA DE PROGRESSO
        ================================================== */

        .progresso {

            width: 100%;

            height: 7px;

            background:
                #e7f0f8;

            border-radius: 20px;

            overflow: hidden;

            margin-bottom: 22px;
        }

        .progresso-barra {

            width: 0%;

            height: 100%;

            background:
                linear-gradient(
                    90deg,
                    #56b5f4,
                    #287ed0
                );

            border-radius: 20px;

            transition:
                width 1s linear;
        }

        /* ==================================================
           BOTÃO INICIAR
        ================================================== */

        .iniciar {

            display: block;

            width:
                min(100%, 210px);

            min-height: 46px;

            margin:
                0 auto 21px;

            border: none;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #287ed0,
                    #1556a5
                );

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 7px 17px
                rgba(40, 126, 208, 0.20);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .iniciar:hover {

            transform:
                translateY(-2px);

            box-shadow:
                0 10px 21px
                rgba(40, 126, 208, 0.27);
        }

        .iniciar:active {

            transform:
                translateY(0);
        }

        /* ==================================================
           CONTROLES
        ================================================== */

        .controles {

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 55px;
        }

        .controle {

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 8px;

            border: none;

            background: transparent;

            color:
                var(--azul-principal);

            font-size: 15px;

            font-weight: 500;

            cursor: pointer;

            padding:
                8px 10px;

            border-radius: 10px;

            transition:
                background 0.2s ease,
                transform 0.2s ease;
        }

        .controle:hover {

            background:
                #edf7ff;

            transform:
                translateY(-1px);
        }

        /* ==================================================
           ÍCONE PAUSA
        ================================================== */

        .icone-pausa {

            width: 27px;

            height: 27px;

            border-radius: 50%;

            background:
                #287ed0;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 11px;

            font-weight: 700;
        }

        /* ==================================================
           ÍCONE REINICIAR
        ================================================== */

        .icone-reiniciar {

            font-size: 24px;

            color:
                var(--azul-principal);

            line-height: 1;
        }

        /* ==================================================
           CELULAR
        ================================================== */

        @media (max-width: 700px) {

            body {

                padding: 0;

                align-items: stretch;
            }

            .pagina {

                width: 100%;

                max-width: none;

                min-height: 100vh;

                border-radius: 0;

                border: none;

                box-shadow: none;

                padding:
                    18px
                    16px
                    24px;
            }

            .cabecalho {

                margin-top: 22px;
            }

            .titulo {

                font-size: 29px;
            }

            .area-respiracao {

                min-height: 360px;

                padding:
                    20px 0;
            }

            .circulo-externo {

                width:
                    min(72vw, 310px);
            }

            .card {

                padding:
                    20px 17px;

                border-radius: 20px;
            }

            .tempos-rapidos {

                display: grid;

                grid-template-columns:
                    repeat(3, 1fr);
            }

            .btn-tempo {

                width: 100%;

                min-width: 0;
            }

            .tempo-personalizado {

                flex-direction: column;
            }

            .tempo-personalizado input,
            .btn-definir {

                width: 100%;

                flex: none;
            }

            .controles {

                gap: 25px;
            }
        }

        /* ==================================================
           CELULAR PEQUENO
        ================================================== */

        @media (max-width: 480px) {

            .pagina {

                padding:
                    16px
                    14px
                    20px;
            }

            .cabecalho {

                margin-top: 19px;
            }

            .titulo {

                font-size: 27px;
            }

            .subtitulo {

                font-size: 14px;
            }

            .area-respiracao {

                min-height: 320px;

                padding:
                    15px 0;
            }

            .circulo-externo {

                width: 235px;
            }

            .texto-respiracao {

                font-size: 25px;
            }

            .card {

                padding:
                    18px 15px;
            }

            .titulo-tempo {

                font-size: 15px;
            }

            .tempos-rapidos {

                grid-template-columns:
                    repeat(2, 1fr);
            }

            .informacoes {

                margin-bottom: 15px;
            }

            .controles {

                gap: 10px;

                justify-content:
                    space-between;
            }
        }

        /* ==================================================
           CELULAR MUITO PEQUENO
        ================================================== */

        @media (max-width: 380px) {

            .area-respiracao {

                min-height: 285px;
            }

            .circulo-externo {

                width: 215px;
            }

            .titulo {

                font-size: 25px;
            }

            .texto-respiracao {

                font-size: 23px;
            }

            .controle {

                font-size: 14px;

                padding:
                    7px 5px;
            }

            .icone-pausa {

                width: 25px;

                height: 25px;
            }
        }

        /* ==================================================
           DESKTOP GRANDE
        ================================================== */

        @media (min-width: 1000px) {

            .pagina {

                min-height:
                    calc(100vh - 48px);
            }

            .area-respiracao {

                min-height: 430px;
            }

            .circulo-externo {

                width: 340px;
            }
        }

    </style>

</head>

<body>

    <main class="pagina">

        <!-- ==================================================
             VOLTAR
        ================================================== -->

        <button
            class="voltar"
            onclick="voltar()"
            type="button"
        >

            ← &nbsp; Voltar

        </button>

        <!-- ==================================================
             CABEÇALHO
        ================================================== -->

        <header class="cabecalho">

            <h1 class="titulo">

                Respire com calma

            </h1>

            <p class="subtitulo">

                Siga o ritmo e respire profundamente.

            </p>

        </header>

        <!-- ==================================================
             ÁREA DA RESPIRAÇÃO
        ================================================== -->

        <section class="area-respiracao">

            <div
                class="circulo-externo"
                id="circulo"
            >

                <div class="circulo-meio">

                    <div class="circulo-interno">

                        <span
                            class="texto-respiracao"
                            id="textoRespiracao"
                        >

                            Inspire...

                        </span>

                    </div>

                </div>

            </div>

        </section>

        <!-- ==================================================
             CONTROLES
        ================================================== -->

        <section class="card">

            <!-- ESCOLHA DE TEMPO -->

            <div class="escolha-tempo">

                <div class="titulo-tempo">

                    <span>
                        Escolha o tempo da respiração
                    </span>

                    <button
                        class="btn-recolher"
                        id="btnRecolher"
                        onclick="alternarTempo()"
                        type="button"
                        aria-label="Fechar escolha de tempo"
                    >

                        ˄

                    </button>

                </div>

                <div
                    class="conteudo-tempo"
                    id="conteudoTempo"
                >

                    <div class="tempos-rapidos">

                        <button
                            class="btn-tempo"
                            onclick="definirTempo(1)"
                            type="button"
                        >

                            1 min

                        </button>

                        <button
                            class="btn-tempo"
                            onclick="definirTempo(3)"
                            type="button"
                        >

                            3 min

                        </button>

                        <button
                            class="btn-tempo"
                            onclick="definirTempo(5)"
                            type="button"
                        >

                            5 min

                        </button>

                        <button
                            class="btn-tempo"
                            onclick="definirTempo(10)"
                            type="button"
                        >

                            10 min

                        </button>

                        <button
                            class="btn-tempo"
                            onclick="definirTempo(15)"
                            type="button"
                        >

                            15 min

                        </button>

                    </div>

                    <div class="tempo-personalizado">

                        <input
                            id="horas"
                            type="number"
                            min="0"
                            placeholder="Horas"
                        >

                        <input
                            id="minutos"
                            type="number"
                            min="0"
                            placeholder="Min"
                        >

                        <input
                            id="segundos"
                            type="number"
                            min="0"
                            placeholder="Seg"
                        >

                        <button
                            class="btn-definir"
                            onclick="definirTempoPersonalizado()"
                            type="button"
                        >

                            Definir tempo

                        </button>

                    </div>

                </div>

            </div>

            <!-- INFORMAÇÕES -->

            <div class="informacoes">

                <span class="rotulo">

                    Tempo restante

                </span>

                <span
                    class="tempo"
                    id="tempo"
                >

                    01:00

                </span>

            </div>

            <!-- BARRA DE PROGRESSO -->

            <div class="progresso">

                <div
                    class="progresso-barra"
                    id="progressoBarra"
                ></div>

            </div>

            <!-- BOTÃO INICIAR -->

            <button
                class="iniciar"
                id="btnIniciar"
                onclick="iniciar()"
                type="button"
            >

                Iniciar

            </button>

            <!-- PAUSAR / REINICIAR -->

            <div class="controles">

                <button
                    class="controle"
                    onclick="pausar()"
                    type="button"
                >

                    <span
                        class="icone-pausa"
                        id="iconePausa"
                    >

                        Ⅱ

                    </span>

                    <span id="textoPausa">

                        Pausar

                    </span>

                </button>

                <button
                    class="controle"
                    onclick="reiniciar()"
                    type="button"
                >

                    <span class="icone-reiniciar">

                        ⟳

                    </span>

                    <span>

                        Reiniciar

                    </span>

                </button>

            </div>

        </section>

    </main>

    <script>

        /* ================================
           VARIÁVEIS
        ================================= */

        let tempoRestante = 60;

        let tempoInicial = 60;

        let intervalo = null;

        let executando = false;

        let pausado = false;

        let cicloRespiracao = null;

        /* ================================
           ELEMENTOS
        ================================= */

        const textoRespiracao =
            document.getElementById(
                "textoRespiracao"
            );

        const circulo =
            document.getElementById(
                "circulo"
            );

        const tempo =
            document.getElementById(
                "tempo"
            );

        const btnIniciar =
            document.getElementById(
                "btnIniciar"
            );

        const textoPausa =
            document.getElementById(
                "textoPausa"
            );

        const iconePausa =
            document.getElementById(
                "iconePausa"
            );

        const progressoBarra =
            document.getElementById(
                "progressoBarra"
            );

        /* ================================
           ABRIR / FECHAR ESCOLHA DE TEMPO
        ================================= */

        function alternarTempo() {

            const conteudoTempo =
                document.getElementById(
                    "conteudoTempo"
                );

            const btnRecolher =
                document.getElementById(
                    "btnRecolher"
                );

            const estaFechado =
                conteudoTempo.classList.contains(
                    "fechado"
                );

            if (estaFechado) {

                conteudoTempo.classList.remove(
                    "fechado"
                );

                btnRecolher.textContent = "˄";

                btnRecolher.setAttribute(
                    "aria-label",
                    "Fechar escolha de tempo"
                );

            } else {

                conteudoTempo.classList.add(
                    "fechado"
                );

                btnRecolher.textContent = "˅";

                btnRecolher.setAttribute(
                    "aria-label",
                    "Abrir escolha de tempo"
                );

            }

        }

        /* ================================
           DEFINIR TEMPO
        ================================= */

        function definirTempo(minutos) {

            pararTudo();

            tempoInicial =
                minutos * 60;

            tempoRestante =
                tempoInicial;

            atualizarTempo();

            atualizarProgresso();

            textoRespiracao.textContent =
                "Inspire...";

            btnIniciar.textContent =
                "Iniciar";

            textoPausa.textContent =
                "Pausar";

            iconePausa.textContent =
                "Ⅱ";

            circulo.classList.remove(
                "inspirando"
            );

            circulo.classList.remove(
                "expirando"
            );
        }

        /* ================================
           TEMPO PERSONALIZADO
        ================================= */

        function definirTempoPersonalizado() {

            const horas =
                Number(
                    document.getElementById(
                        "horas"
                    ).value
                ) || 0;

            const minutos =
                Number(
                    document.getElementById(
                        "minutos"
                    ).value
                ) || 0;

            const segundos =
                Number(
                    document.getElementById(
                        "segundos"
                    ).value
                ) || 0;

            const total =
                horas * 3600 +
                minutos * 60 +
                segundos;

            if (total <= 0) {

                return;

            }

            pararTudo();

            tempoInicial =
                total;

            tempoRestante =
                total;

            atualizarTempo();

            atualizarProgresso();

            textoRespiracao.textContent =
                "Inspire...";

            btnIniciar.textContent =
                "Iniciar";

            textoPausa.textContent =
                "Pausar";

            iconePausa.textContent =
                "Ⅱ";

            circulo.classList.remove(
                "inspirando"
            );

            circulo.classList.remove(
                "expirando"
            );
        }

        /* ================================
           INICIAR
        ================================= */

        function iniciar() {

            if (tempoRestante <= 0) {

                tempoRestante =
                    tempoInicial;

                atualizarTempo();

                atualizarProgresso();

                textoRespiracao.textContent =
                    "Inspire...";

                circulo.classList.remove(
                    "inspirando"
                );

                circulo.classList.remove(
                    "expirando"
                );
            }

            if (
                executando &&
                !pausado
            ) {

                return;

            }

            executando = true;

            pausado = false;

            btnIniciar.textContent =
                "Em andamento";

            textoPausa.textContent =
                "Pausar";

            iconePausa.textContent =
                "Ⅱ";

            iniciarRespiracao();

            clearInterval(intervalo);

            intervalo =
                setInterval(
                    function() {

                        tempoRestante--;

                        atualizarTempo();

                        atualizarProgresso();

                        if (
                            tempoRestante <= 0
                        ) {

                            finalizar();

                        }

                    },
                    1000
                );
        }

        /* ================================
           CICLO DE RESPIRAÇÃO
        ================================= */

        function iniciarRespiracao() {

            if (
                !executando ||
                pausado
            ) {

                return;

            }

            textoRespiracao.textContent =
                "Inspire...";

            circulo.classList.remove(
                "expirando"
            );

            circulo.classList.add(
                "inspirando"
            );

            cicloRespiracao =
                setTimeout(
                    function() {

                        if (
                            !executando ||
                            pausado
                        ) {

                            return;

                        }

                        textoRespiracao.textContent =
                            "Expire...";

                        circulo.classList.remove(
                            "inspirando"
                        );

                        circulo.classList.add(
                            "expirando"
                        );

                        cicloRespiracao =
                            setTimeout(
                                function() {

                                    if (
                                        !executando ||
                                        pausado
                                    ) {

                                        return;

                                    }

                                    iniciarRespiracao();

                                },
                                4000
                            );

                    },
                    4000
                );
        }

        /* ================================
           PAUSAR
        ================================= */

        function pausar() {

            if (!executando) {

                return;

            }

            if (!pausado) {

                pausado = true;

                clearInterval(
                    intervalo
                );

                clearTimeout(
                    cicloRespiracao
                );

                textoPausa.textContent =
                    "Continuar";

                iconePausa.textContent =
                    "▶";

                textoRespiracao.textContent =
                    "Pausado";

                circulo.classList.remove(
                    "inspirando"
                );

                circulo.classList.remove(
                    "expirando"
                );

            } else {

                iniciar();

            }

        }

        /* ================================
           REINICIAR
        ================================= */

        function reiniciar() {

            clearInterval(
                intervalo
            );

            clearTimeout(
                cicloRespiracao
            );

            tempoRestante =
                tempoInicial;

            executando = false;

            pausado = false;

            atualizarTempo();

            atualizarProgresso();

            textoRespiracao.textContent =
                "Inspire...";

            textoPausa.textContent =
                "Pausar";

            iconePausa.textContent =
                "Ⅱ";

            btnIniciar.textContent =
                "Iniciar";

            circulo.classList.remove(
                "inspirando"
            );

            circulo.classList.remove(
                "expirando"
            );

        }

        /* ================================
           FINALIZAR
        ================================= */

        function finalizar() {

            clearInterval(
                intervalo
            );

            clearTimeout(
                cicloRespiracao
            );

            executando = false;

            pausado = false;

            tempoRestante = 0;

            atualizarTempo();

            progressoBarra.style.width =
                "100%";

            textoRespiracao.textContent =
                "Concluído!";

            btnIniciar.textContent =
                "Iniciar novamente";

            circulo.classList.remove(
                "inspirando"
            );

            circulo.classList.remove(
                "expirando"
            );

        }

        /* ================================
           ATUALIZAR TEMPO
        ================================= */

        function atualizarTempo() {

            if (tempoRestante <= 0) {

                tempo.textContent =
                    "00:00";

                return;

            }

            const horas =
                Math.floor(
                    tempoRestante / 3600
                );

            const minutos =
                Math.floor(
                    (tempoRestante % 3600) / 60
                );

            const segundos =
                tempoRestante % 60;

            if (horas > 0) {

                tempo.textContent =
                    String(horas).padStart(2, "0") +
                    ":" +
                    String(minutos).padStart(2, "0") +
                    ":" +
                    String(segundos).padStart(2, "0");

            } else {

                tempo.textContent =
                    String(minutos).padStart(2, "0") +
                    ":" +
                    String(segundos).padStart(2, "0");

            }

        }

        /* ================================
           ATUALIZAR PROGRESSO
        ================================= */

        function atualizarProgresso() {

            if (tempoInicial <= 0) {

                return;

            }

            const progresso =
                (
                    (tempoInicial - tempoRestante)
                    / tempoInicial
                ) * 100;

            progressoBarra.style.width =
                progresso + "%";

        }

        /* ================================
           PARAR TUDO
        ================================= */

        function pararTudo() {

            clearInterval(
                intervalo
            );

            clearTimeout(
                cicloRespiracao
            );

            intervalo = null;

            cicloRespiracao = null;

            executando = false;

            pausado = false;

        }

        /* ================================
           VOLTAR
        ================================= */

        function voltar() {

            window.history.back();

        }

        /* ================================
           INICIALIZAÇÃO
        ================================= */

        atualizarTempo();

        atualizarProgresso();

    </script>

</body>

</html>
