<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pensamento positivo | ICOMA</title>


    <style>

        /* =================================
           RESET
        ================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        /* =================================
           PÁGINA
        ================================= */

        body {

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #eef4ff,
                    #e5eefb
                );

            color: #263f70;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 24px;
        }


        /* =================================
           CONTAINER
        ================================= */

        .pagina {

            width: 100%;

            max-width: 760px;

            min-height: 700px;

            background: #edf3fd;

            border-radius: 28px;

            padding:
                clamp(20px, 4vw, 38px);

            box-shadow:
                0 12px 35px
                rgba(48, 91, 135, 0.15);

            display: flex;

            flex-direction: column;

            position: relative;

            overflow: hidden;
        }


        /* =================================
           DECORAÇÃO
        ================================= */

        .pagina::before {

            content: "";

            position: absolute;

            width: 270px;

            height: 270px;

            border-radius: 50%;

            background: #dceafa;

            top: -140px;

            right: -100px;

            opacity: 0.65;
        }


        /* =================================
           BOTÃO VOLTAR PARA O INDEX
        ================================= */

        .voltar {

            width: fit-content;

            min-height: 48px;

            padding:
                10px 18px;

            border: none;

            border-radius: 11px;

            background: white;

            color: #087fc1;

            font-size: 18px;

            cursor: pointer;

            box-shadow:
                0 4px 10px
                rgba(45, 79, 112, 0.14);

            transition:
                0.2s ease;

            position: relative;

            z-index: 2;
        }


        .voltar:hover {

            transform:
                translateX(-3px);

            box-shadow:
                0 6px 14px
                rgba(45, 79, 112, 0.2);
        }


        /* =================================
           CABEÇALHO
        ================================= */

        .cabecalho {

            margin-top: 34px;

            padding:
                0 5px;

            position: relative;

            z-index: 1;

            text-align: center;
        }


        .titulo {

            font-size:
                clamp(22px, 4vw, 30px);

            font-weight: 500;

            line-height: 1.3;

            color: #263f70;
        }


        .subtitulo {

            margin-top: 10px;

            color: #60769c;

            font-size: 16px;
        }


        /* =================================
           ÁREA DA MENSAGEM
        ================================= */

        .area-mensagem {

            flex: 1;

            min-height: 330px;

            display: flex;

            justify-content: center;

            align-items: center;

            padding:
                30px 10px;

            position: relative;

            z-index: 1;
        }


        /* =================================
           CARTÃO DA MENSAGEM
        ================================= */

        .mensagem-card {

            width: 100%;

            max-width: 560px;

            min-height: 250px;

            background: white;

            border-radius: 25px;

            padding:
                35px 30px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

            box-shadow:
                0 8px 25px
                rgba(45, 79, 112, 0.10);

            transition:
                opacity 0.3s ease,
                transform 0.3s ease;
        }


        .mensagem-card.trocando {

            opacity: 0;

            transform:
                translateY(10px);
        }


        /* =================================
           CORAÇÃO
        ================================= */

        .coracao {

            font-size: 48px;

            color: #087fc1;

            margin-bottom: 20px;

            animation:
                pulsar 3s
                ease-in-out
                infinite;
        }


        @keyframes pulsar {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }

            100% {
                transform: scale(1);
            }
        }


        /* =================================
           TEXTO DA MENSAGEM
        ================================= */

        .texto-mensagem {

            color: #263f70;

            font-size:
                clamp(20px, 4vw, 25px);

            line-height: 1.5;

            font-weight: 400;

            max-width: 480px;
        }


        /* =================================
           CONTADOR
        ================================= */

        .contador-mensagens {

            margin-top: 20px;

            color: #7286a7;

            font-size: 15px;
        }


        /* =================================
           CONTROLES
        ================================= */

        .controles {

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 10px;

            padding-bottom: 10px;

            position: relative;

            z-index: 2;
        }


        /* =================================
           NAVEGAÇÃO ENTRE FRASES
        ================================= */

        .navegacao-frases {

            width: 100%;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 10px;
        }


        .btn-anterior,
        .btn-proxima {

            width: 140px;

            height: 50px;

            border-radius: 12px;

            font-size: 17px;

            cursor: pointer;

            transition:
                0.25s ease;
        }


        /* =================================
           BOTÃO ANTERIOR
        ================================= */

        .btn-anterior {

            background: white;

            color: #087fc1;

            border:
                2px solid #087fc1;
        }


        .btn-anterior:hover {

            background: #eaf5ff;

            transform:
                translateY(-2px);
        }


        /* =================================
           BOTÃO PRÓXIMA
        ================================= */

        .btn-proxima {

            background: #087fc1;

            color: white;

            border: none;

            box-shadow:
                0 5px 14px
                rgba(8, 127, 193, 0.20);
        }


        .btn-proxima:hover {

            background: #076fa9;

            transform:
                translateY(-2px);

            box-shadow:
                0 8px 18px
                rgba(8, 127, 193, 0.25);
        }


        /* =================================
           BOTÕES DE FAVORITOS
        ================================= */

        .btn-favoritar,
        .btn-favoritos {

            width:
                min(100%, 280px);

            min-height: 46px;

            padding:
                10px 20px;

            border-radius: 13px;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition:
                0.25s ease;
        }


        .btn-favoritar {

            background: white;

            color: #087fc1;

            border:
                2px solid #087fc1;
        }


        .btn-favoritar:hover {

            background: #eaf5ff;

            transform:
                translateY(-2px);
        }


        .btn-favoritos {

            background: #dcecff;

            color: #263f70;

            border: none;
        }


        .btn-favoritos:hover {

            background: #cce2ff;

            transform:
                translateY(-2px);
        }


        /* =================================
           BOTÃO VER TODAS
        ================================= */

        .btn-todas {

            width:
                min(100%, 280px);

            min-height: 46px;

            padding:
                10px 20px;

            border-radius: 13px;

            background: transparent;

            border:
                1px solid #9bb9d6;

            color: #087fc1;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            transition:
                0.25s ease;
        }


        .btn-todas:hover {

            background: white;

            transform:
                translateY(-2px);
        }


        /* =================================
           LISTAS
        ================================= */

        .lista-favoritos,
        .lista-todas {

            width: 100%;

            max-width: 560px;

            margin:
                15px auto 0;

            display: none;

            animation:
                aparecer 0.3s ease;
        }


        /* =================================
           ITEM FAVORITO
        ================================= */

        .favorito-item {

            background: white;

            padding:
                16px 18px;

            border-radius: 15px;

            margin-bottom: 10px;

            color: #263f70;

            box-shadow:
                0 3px 10px
                rgba(0, 0, 0, 0.05);

            text-align: left;

            line-height: 1.5;
        }


        /* =================================
           ITEM DE TODAS AS MENSAGENS
        ================================= */

        .mensagem-item {

            background: white;

            padding:
                16px 18px;

            border-radius: 15px;

            margin-bottom: 10px;

            color: #263f70;

            box-shadow:
                0 3px 10px
                rgba(0, 0, 0, 0.05);

            text-align: left;

            line-height: 1.5;

            display: flex;

            align-items: center;

            gap: 12px;
        }


        .numero-mensagem {

            min-width: 30px;

            height: 30px;

            border-radius: 50%;

            background: #dcecff;

            color: #087fc1;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 13px;

            font-weight: bold;
        }


        /* =================================
           REMOVER FAVORITO
        ================================= */

        .remover-favorito {

            margin-top: 9px;

            background: none;

            border: none;

            color: #087fc1;

            cursor: pointer;

            font-size: 13px;

            padding: 0;
        }


        .remover-favorito:hover {

            text-decoration: underline;
        }


        /* =================================
           ANIMAÇÃO
        ================================= */

        @keyframes aparecer {

            from {

                opacity: 0;

                transform:
                    translateY(-8px);
            }

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }
        }


        /* =================================
           TABLET
        ================================= */

        @media (max-width: 700px) {

            body {

                padding: 0;

                align-items: stretch;
            }


            .pagina {

                min-height: 100vh;

                max-width: none;

                border-radius: 0;

                box-shadow: none;

                padding:
                    22px;
            }


            .cabecalho {

                margin-top: 28px;
            }

        }


        /* =================================
           CELULAR
        ================================= */

        @media (max-width: 480px) {

            .pagina {

                padding:
                    18px 16px 24px;
            }


            .voltar {

                font-size: 17px;

                min-height: 46px;

                padding:
                    9px 14px;
            }


            .cabecalho {

                margin-top: 28px;
            }


            .titulo {

                font-size: 22px;
            }


            .subtitulo {

                font-size: 15px;
            }


            .area-mensagem {

                min-height: 320px;

                padding:
                    20px 0;
            }


            .mensagem-card {

                min-height: 240px;

                padding:
                    28px 20px;
            }


            .coracao {

                font-size: 42px;
            }


            .texto-mensagem {

                font-size: 20px;
            }


            /* BOTÕES ANTERIOR E PRÓXIMA */

            .navegacao-frases {

                gap: 8px;
            }


            .btn-anterior,
            .btn-proxima {

                width: 50%;

                font-size: 15px;
            }


            .btn-favoritar,
            .btn-favoritos,
            .btn-todas {

                width: 100%;

                max-width: 280px;
            }


            .mensagem-item {

                align-items:
                    flex-start;
            }

        }


        /* =================================
           CELULAR PEQUENO
        ================================= */

        @media (max-width: 360px) {

            .titulo {

                font-size: 20px;
            }


            .mensagem-card {

                padding:
                    24px 16px;
            }


            .texto-mensagem {

                font-size: 18px;
            }


            .btn-anterior,
            .btn-proxima {

                font-size: 14px;
            }

        }

    </style>

</head>


<body>


    <main class="pagina">


        <!-- =================================
             VOLTAR PARA O INDEX
        ================================= -->

        <button
            class="voltar"
            onclick="voltar()"
        >

            ← &nbsp; Pensamento positivo

        </button>


        <!-- =================================
             CABEÇALHO
        ================================= -->

        <header class="cabecalho">

            <h1 class="titulo">

                Leia e reflita sobre a mensagem

            </h1>


            <p class="subtitulo">

                Uma pequena mensagem para o seu momento.

            </p>

        </header>


        <!-- =================================
             MENSAGEM ATUAL
        ================================= -->

        <section class="area-mensagem">

            <div
                class="mensagem-card"
                id="mensagemCard"
            >

                <div class="coracao">

                    ♥️

                </div>


                <p
                    class="texto-mensagem"
                    id="textoMensagem"
                ></p>


                <div
                    class="contador-mensagens"
                    id="contadorMensagens"
                ></div>

            </div>

        </section>


        <!-- =================================
             CONTROLES
        ================================= -->

        <section class="controles">


            <!-- =================================
                 ANTERIOR / PRÓXIMA
            ================================= -->

            <div class="navegacao-frases">


                <button
                    class="btn-anterior"
                    onclick="mensagemAnterior()"
                >

                    ← Anterior

                </button>


                <button
                    class="btn-proxima"
                    onclick="proximaMensagem()"
                >

                    Próxima →

                </button>


            </div>


            <!-- =================================
                 FAVORITAR
            ================================= -->

            <button
                class="btn-favoritar"
                id="favoritarBtn"
            >

                ♡ Favoritar mensagem

            </button>


            <!-- =================================
                 FAVORITOS
            ================================= -->

            <button
                class="btn-favoritos"
                id="favoritosBtn"
            >

                ♥ Minhas mensagens favoritas

            </button>


            <!-- =================================
                 TODAS AS MENSAGENS
            ================================= -->

            <button
                class="btn-todas"
                id="todasBtn"
            >

                ☰ Ver todas as mensagens

            </button>


            <!-- =================================
                 LISTA DE FAVORITOS
            ================================= -->

            <div
                class="lista-favoritos"
                id="listaFavoritos"
            ></div>


            <!-- =================================
                 LISTA DE TODAS
            ================================= -->

            <div
                class="lista-todas"
                id="listaTodas"
            ></div>


        </section>


    </main>


    <script>


        /* =================================
           MENSAGENS
        ================================= */

        const mensagens = [

            "Você não precisa resolver tudo de uma vez.",

            "Está tudo bem fazer uma pausa quando precisar.",

            "Seu esforço também merece ser reconhecido.",

            "Um momento difícil não define quem você é.",

            "Você está aprendendo, crescendo e descobrindo seu caminho.",

            "Não existe problema em não ter todas as respostas agora.",

            "Pequenos passos também são progresso.",

            "Seja gentil consigo mesmo durante o seu processo.",

            "Você merece momentos de calma e tranquilidade.",

            "Continue. Mesmo devagar, você ainda está avançando."

        ];


        /* =================================
           VARIÁVEIS
        ================================= */

        let indiceAtual = 0;


        let favoritos =
            JSON.parse(
                localStorage.getItem(
                    "favoritosICOMA"
                )
            ) || [];


        /* =================================
           ELEMENTOS
        ================================= */

        const textoMensagem =
            document.getElementById(
                "textoMensagem"
            );


        const contadorMensagens =
            document.getElementById(
                "contadorMensagens"
            );


        const mensagemCard =
            document.getElementById(
                "mensagemCard"
            );


        const favoritarBtn =
            document.getElementById(
                "favoritarBtn"
            );


        const favoritosBtn =
            document.getElementById(
                "favoritosBtn"
            );


        const listaFavoritos =
            document.getElementById(
                "listaFavoritos"
            );


        const todasBtn =
            document.getElementById(
                "todasBtn"
            );


        const listaTodas =
            document.getElementById(
                "listaTodas"
            );


        /* =================================
           MOSTRAR MENSAGEM
        ================================= */

        function mostrarMensagem() {

            textoMensagem.textContent =
                mensagens[indiceAtual];


            contadorMensagens.textContent =
                `${indiceAtual + 1} / ${mensagens.length}`;


            atualizarBotaoFavoritar();

        }


        /* =================================
           PRÓXIMA FRASE
        ================================= */

        function proximaMensagem() {

            mensagemCard.classList.add(
                "trocando"
            );


            setTimeout(() => {

                indiceAtual++;


                /*
                    Se chegar depois
                    da última frase,
                    volta para a primeira.
                */

                if (
                    indiceAtual >=
                    mensagens.length
                ) {

                    indiceAtual = 0;

                }


                mostrarMensagem();


                mensagemCard.classList.remove(
                    "trocando"
                );

            }, 300);

        }


        /* =================================
           FRASE ANTERIOR
        ================================= */

        function mensagemAnterior() {

            mensagemCard.classList.add(
                "trocando"
            );


            setTimeout(() => {

                indiceAtual--;


                /*
                    Se estiver na primeira
                    frase, volta para a última.
                */

                if (
                    indiceAtual < 0
                ) {

                    indiceAtual =
                        mensagens.length - 1;

                }


                mostrarMensagem();


                mensagemCard.classList.remove(
                    "trocando"
                );

            }, 300);

        }


        /* =================================
           ATUALIZAR BOTÃO FAVORITAR
        ================================= */

        function atualizarBotaoFavoritar() {

            const mensagemAtual =
                mensagens[indiceAtual];


            if (
                favoritos.includes(
                    mensagemAtual
                )
            ) {

                favoritarBtn.innerHTML =
                    "♥ Mensagem favoritada";

            }

            else {

                favoritarBtn.innerHTML =
                    "♡ Favoritar mensagem";

            }

        }


        /* =================================
           FAVORITAR
        ================================= */

        favoritarBtn.addEventListener(
            "click",
            function () {

                const mensagemAtual =
                    mensagens[indiceAtual];


                /*
                    Se já estiver favoritada,
                    remove.
                */

                if (
                    favoritos.includes(
                        mensagemAtual
                    )
                ) {

                    favoritos =
                        favoritos.filter(
                            mensagem =>
                                mensagem !==
                                mensagemAtual
                        );

                }


                /*
                    Caso contrário,
                    adiciona.
                */

                else {

                    favoritos.push(
                        mensagemAtual
                    );

                }


                /*
                    Salva no navegador.
                */

                localStorage.setItem(
                    "favoritosICOMA",
                    JSON.stringify(
                        favoritos
                    )
                );


                atualizarBotaoFavoritar();

                mostrarFavoritos();

            }
        );


        /* =================================
           MOSTRAR FAVORITOS
        ================================= */

        favoritosBtn.addEventListener(
            "click",
            function () {

                if (
                    listaFavoritos.style.display ===
                    "none" ||
                    listaFavoritos.style.display ===
                    ""
                ) {

                    listaFavoritos.style.display =
                        "block";


                    favoritosBtn.innerHTML =
                        "♥ Ocultar favoritos";


                    mostrarFavoritos();

                }

                else {

                    listaFavoritos.style.display =
                        "none";


                    favoritosBtn.innerHTML =
                        "♥ Minhas mensagens favoritas";

                }

            }
        );


        /* =================================
           CRIAR LISTA DE FAVORITOS
        ================================= */

        function mostrarFavoritos() {

            listaFavoritos.innerHTML = "";


            if (
                favoritos.length === 0
            ) {

                listaFavoritos.innerHTML = `

                    <div class="favorito-item">

                        Você ainda não possui
                        mensagens favoritas. 💙

                    </div>

                `;

                return;

            }


            favoritos.forEach(
                (mensagem, indice) => {

                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "favorito-item";


                    item.innerHTML = `

                        <div>

                            ♥ ${mensagem}

                        </div>

                        <button
                            class="remover-favorito"
                            onclick="removerFavorito(${indice})"
                        >

                            Remover dos favoritos

                        </button>

                    `;


                    listaFavoritos.appendChild(
                        item
                    );

                }
            );

        }


        /* =================================
           REMOVER FAVORITO
        ================================= */

        function removerFavorito(
            indice
        ) {

            favoritos.splice(
                indice,
                1
            );


            localStorage.setItem(
                "favoritosICOMA",
                JSON.stringify(
                    favoritos
                )
            );


            mostrarFavoritos();

            atualizarBotaoFavoritar();

        }


        /* =================================
           VER TODAS AS MENSAGENS
        ================================= */

        todasBtn.addEventListener(
            "click",
            function () {

                if (
                    listaTodas.style.display ===
                    "none" ||
                    listaTodas.style.display ===
                    ""
                ) {

                    listaTodas.style.display =
                        "block";


                    todasBtn.innerHTML =
                        "▲ Ocultar mensagens";


                    mostrarTodas();

                }

                else {

                    listaTodas.style.display =
                        "none";


                    todasBtn.innerHTML =
                        "☰ Ver todas as mensagens";

                }

            }
        );


        /* =================================
           CRIAR LISTA DE TODAS AS MENSAGENS
        ================================= */

        function mostrarTodas() {

            listaTodas.innerHTML = "";


            mensagens.forEach(
                (mensagem, indice) => {

                    const item =
                        document.createElement(
                            "div"
                        );


                    item.className =
                        "mensagem-item";


                    item.innerHTML = `

                        <span class="numero-mensagem">

                            ${indice + 1}

                        </span>

                        <span>

                            ${mensagem}

                        </span>

                    `;


                    listaTodas.appendChild(
                        item
                    );

                }
            );

        }


        /* =================================
           VOLTAR PARA O INDEX
        ================================= */

        function voltar() {

            window.history.back();

        }


        /* =================================
           INICIALIZAÇÃO
        ================================= */

        mostrarMensagem();

        mostrarFavoritos();

        mostrarTodas();


        /*
            As listas começam fechadas.
        */

        listaFavoritos.style.display =
            "none";

        listaTodas.style.display =
            "none";


    </script>


</body>

</html>
