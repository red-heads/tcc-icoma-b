<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color: #f5f6fb;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card{
            width: 380px;
            border-radius: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            overflow: hidden;
            background: white;
        }

        .topo{
            background: linear-gradient(to right, #dfe9ff, #eef3ff);
            padding: 30px;
        }

        .form-area{
            padding: 30px;
        }

        .btn-login{
            background: #6c9df5;
            border: none;
            border-radius: 12px;
            padding: 12px;
        }

        .btn-login:hover{
            background: #5a8be6;
        }

        .cadastro{
            text-decoration: none;
            color: #7c8aa5;
            font-size: 14px;
        }

        .form-control{
            border-radius: 12px;
            height: 50px;
        }
    </style>
</head>
<body>

<div class="login-card">

    <div class="topo">
        <h3 class="fw-bold">➜ Tudo bem aí?</h3>
        <p class="fs-5 mb-1">Você não está sozinho(a).</p>
        <p class="text-muted">
            Entre para acessar seu painel de apoio emocional.
        </p>
    </div>

    <div class="form-area">

        <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" class="form-control">
        </div>

        <div class="mb-4">
            <label class="form-label">Senha</label>
            <input type="password" class="form-control">
        </div>

        <button class="btn btn-login text-white w-100">
            Entrar
        </button>

        <div class="text-center mt-3">
            <a href="#" class="cadastro">Cadastro</a>
        </div>

    </div>

</div>

</body>
</html>
</html>
